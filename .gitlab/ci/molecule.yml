########################
##      Molecule      ##
########################

.molecule:
  stage: ansible_molecule_test
  image: registry.gitlab.com/gitlab-org/gitlab-environment-toolkit:dev
  tags:
    - saas-linux-medium-amd64
  services:
    - name: ${GITLAB_DEPENDENCY_PROXY}docker:dind
      alias: docker
      entrypoint:
        [
          "sh",
          "-c",
          "dockerd-entrypoint.sh --registry-mirror=https://mirror.gcr.io",
        ]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    FF_NETWORK_PER_BUILD: true
  interruptible: true
  before_script:
    - apt-get update && apt-get install -y rsync
    - curl -fsSL https://get.docker.com -o get-docker.sh && chmod +x ./get-docker.sh
    - ./get-docker.sh
    - pip install molecule docker molecule-plugins[docker]
    - curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
  script:
    - cd ansible
    - echo "Running molecule test --scenario-name $MOLECULE_SCENARIO"
    - molecule test --scenario-name $MOLECULE_SCENARIO

.molecule-skip-jobs:
  rules:
    - if: $SKIP_MOLECULE_JOB == $CI_JOB_NAME
      when: never
    - if: $SKIP_ALL_MOLECULE_JOBS == "true"
      when: never

.on_web_pipelines:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $RUN_MOLECULE_SCENARIOS == "true"
      when: manual
      allow_failure: true

.molecule-os:
  extends: .molecule
  allow_failure: true
  rules:
    - !reference [.molecule-skip-jobs, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/roles/common/**/*
        - ansible/roles/haproxy/**/*
        - ansible/molecule/os-verification/*
      when: manual
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MOLECULE_SCHEDULE == "os"
    - !reference [.on_web_pipelines, rules]

## Merge Request Jobs

ubuntu2404:single-node-with-haproxy:
  extends: .molecule
  variables:
    MOLECULE_SCENARIO: single-node-with-haproxy
  rules:
    - !reference [.molecule-skip-jobs, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/playbooks/common.yml
        - ansible/playbooks/gitlab_rails.yml
        - ansible/playbooks/haproxy.yml
        - ansible/roles/common/**/!(uninstall.yml)
        - ansible/roles/gitlab_rails/**/*
        - ansible/roles/haproxy/**/*
        - ansible/requirements/**/*
    - !reference [.on_web_pipelines, rules]

ubuntu2404:single-node:
  extends: .molecule
  variables:
    MOLECULE_SCENARIO: single-node
  rules:
    - !reference [.molecule-skip-jobs, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/playbooks/common.yml
        - ansible/playbooks/gitlab_rails.yml
        - ansible/roles/common/**/!(uninstall.yml)
        - ansible/roles/gitlab_rails/**/*
    - !reference [.on_web_pipelines, rules]

ubuntu2404:single-node-geo:
  extends: .molecule
  tags:
    - saas-linux-xlarge-amd64
  variables:
    MOLECULE_SCENARIO: single-node-geo
  rules:
    - !reference [.molecule-skip-jobs, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/playbooks/common.yml
        - ansible/playbooks/gitlab_rails.yml
        - ansible/playbooks/gitlab_geo.yml
        - ansible/roles/common/**/!(uninstall.yml)
        - ansible/roles/gitlab_rails/**/*
        - ansible/roles/gitlab_geo/**/*
    - !reference [.on_web_pipelines, rules]

cloud-native-hybrid:
  extends: .molecule
  tags:
    - saas-linux-large-amd64
  variables:
    MOLECULE_SCENARIO: cloud-native-hybrid
  rules:
    - !reference [.molecule-skip-jobs, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/molecule/cloud-native-hybrid/*
        - ansible/roles/common/**/!(uninstall.yml)
        - ansible/roles/gitlab_charts/**/*
        - ansible/roles/postgres/**/*
        - ansible/roles/redis/**/*
    - !reference [.on_web_pipelines, rules]

cloud-native:
  extends: .molecule
  variables:
    MOLECULE_SCENARIO: cloud-native
  rules:
    - !reference [.molecule-skip-jobs, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
