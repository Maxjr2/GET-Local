########################
##      Packages      ##
########################

.docker-build-base:
  stage: upload
  image: docker:29
  services:
    - name: docker:29-dind
      command: ["--mtu=1400"] # https://gitlab.com/gitlab-org/gitlab/-/work_items/473739#workaround
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# Check jobs - Build and test locally without pushing
.docker-check-base:
  extends: .docker-build-base
  stage: test
  script:
    - docker build -t test-image .
    - docker run --rm test-image bash -c "ansible --version && gcloud --version && aws --version && az --version && mise --version && mise install terraform && terraform version && kubectl version --client && helm version"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .tool-versions
        - ansible/requirements/requirements.txt
        - ansible/requirements/ansible-galaxy-requirements.yml
        - ansible/galaxy.yml
        - .gitlab/ci/packages.yml

check:docker-image-amd64:
  extends: .docker-check-base
  tags:
    - saas-linux-medium-amd64

check:docker-image-arm64:
  extends: .docker-check-base
  tags:
    - saas-linux-medium-arm64

# Dev builds
upload-docker-image-dev-amd64:
  extends: .docker-build-base
  tags:
    - saas-linux-medium-amd64
  script:
    - docker build --cache-from $CI_REGISTRY_IMAGE:dev-amd64 --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg install_python_latest_pkgs=true -t $CI_REGISTRY_IMAGE:dev-amd64 .
    - docker push $CI_REGISTRY_IMAGE:dev-amd64
  rules:
    - !reference [.on_default_branch_except_schedule, rules]

upload-docker-image-dev-arm64:
  extends: .docker-build-base
  tags:
    - saas-linux-medium-arm64
  script:
    - docker build --cache-from $CI_REGISTRY_IMAGE:dev-arm64 --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg install_python_latest_pkgs=true -t $CI_REGISTRY_IMAGE:dev-arm64 .
    - docker push $CI_REGISTRY_IMAGE:dev-arm64
  rules:
    - !reference [.on_default_branch_except_schedule, rules]

upload-docker-image-dev-manifest:
  extends: .docker-build-base
  needs:
    - upload-docker-image-dev-amd64
    - upload-docker-image-dev-arm64
  script:
    - docker buildx imagetools create -t $CI_REGISTRY_IMAGE:dev $CI_REGISTRY_IMAGE:dev-amd64 $CI_REGISTRY_IMAGE:dev-arm64
  rules:
    - !reference [.on_default_branch_except_schedule, rules]

# Release builds
upload-docker-image-release-amd64:
  extends: .docker-build-base
  tags:
    - saas-linux-medium-amd64
  script:
    - docker build --cache-from $CI_REGISTRY_IMAGE:dev-amd64 --build-arg BUILDKIT_INLINE_CACHE=1 -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64 .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64
  rules:
    - !reference [.on_tag_events, rules]

upload-docker-image-release-arm64:
  extends: .docker-build-base
  tags:
    - saas-linux-medium-arm64
  script:
    - docker build --cache-from $CI_REGISTRY_IMAGE:dev-arm64 --build-arg BUILDKIT_INLINE_CACHE=1 -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64 .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64
  rules:
    - !reference [.on_tag_events, rules]

upload-docker-image-release-manifest:
  extends: .docker-build-base
  needs:
    - upload-docker-image-release-amd64
    - upload-docker-image-release-arm64
  script:
    - docker buildx imagetools create -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-amd64 $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-arm64
    - |
      if echo $CI_COMMIT_TAG | grep -qv ".*beta.*"; then
        docker buildx imagetools create -t $CI_REGISTRY_IMAGE:latest $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG

        major_ver=$(echo $CI_COMMIT_TAG | cut -d '.' -f 1)
        docker buildx imagetools create -t $CI_REGISTRY_IMAGE:$major_ver $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG

        major_minor_ver=$(echo $CI_COMMIT_TAG | cut -d '.' -f 1,2)
        docker buildx imagetools create -t $CI_REGISTRY_IMAGE:$major_minor_ver $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
      fi
  rules:
    - !reference [.on_tag_events, rules]

upload-terraform-module:
  stage: upload
  image: curlimages/curl:latest
  script:
    - cd terraform
    - tar -czf gitlab_environment_toolkit.tgz modules
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file gitlab_environment_toolkit.tgz "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/gitlab-environment-toolkit/gitlab/${CI_COMMIT_TAG}/file"'
  rules:
    - !reference [.on_tag_events, rules]
