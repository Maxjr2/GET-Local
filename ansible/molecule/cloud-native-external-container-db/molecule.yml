---
driver:
  name: docker
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ./inventory
  env:
    ANSIBLE_ROLES_PATH: ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:../../roles
    ANSIBLE_CONFIG: ../../ansible.cfg
    ANSIBLE_COLLECTIONS_DUPLICATE_WARNINGS: false
    MOLECULE_DISPLAY_MISSING_SCHEMA: false
    ANSIBLE_GALAXY_DISPLAY_SKIPPED: false
platforms:
  - name: postgres-external
    image: postgres:latest
    command: ["docker-entrypoint.sh", "postgres"]
    docker_networks:
      - name: molecule_cn_ext_container_db_network
        ipam_config:
          - subnet: 172.18.0.0/16
            gateway: 172.18.0.1
    network_mode: molecule_cn_ext_container_db_network
    networks:
      - name: molecule_cn_ext_container_db_network
        ipv4_address: 172.18.0.2
    exposed_ports:
      - 5432/tcp
    published_ports:
      - 0.0.0.0:5432:5432/tcp
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${MOLECULE_POSTGRES_ADMIN_PASSWORD}"
  - name: redis-external
    image: redis:latest
    command: ["redis-server", "--requirepass", "${MOLECULE_REDIS_PASSWORD}"]
    network_mode: molecule_cn_ext_container_db_network
    networks:
      - name: molecule_cn_ext_container_db_network
        ipv4_address: 172.18.0.3
    exposed_ports:
      - 6379/tcp
    published_ports:
      - 0.0.0.0:6379:6379/tcp
    env:
      REDIS_PASSWORD: "${MOLECULE_REDIS_PASSWORD}"
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
