---
driver:
  name: docker
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ./inventory
  config_options:
    defaults:
      display_skipped_hosts: false
      stdout_callback: yaml
  env:
    ANSIBLE_ROLES_PATH: ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:../../roles
    ANSIBLE_COLLECTIONS_DUPLICATE_WARNINGS: false
    MOLECULE_DISPLAY_MISSING_SCHEMA: false
    ANSIBLE_GALAXY_DISPLAY_SKIPPED: false
platforms:
  - &default_platform
    name: postgres-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    pre_build_image: true
    privileged: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    network_mode: molecule_cloud_native_hybrid_network
    networks:
      - name: molecule_cloud_native_hybrid_network
  - <<: *default_platform
    name: redis-1
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
