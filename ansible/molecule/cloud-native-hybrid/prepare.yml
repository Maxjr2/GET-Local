---
- name: Configure k3d
  hosts: localhost
  tasks:
    - name: Create k3d Cluster
      environment:
        K3D_FIX_DNS: "0"
      command: |
        k3d cluster create {{ molecule_cluster_name }} \
          --network molecule_network \
          --port "80:80@loadbalancer"

    - name: Add workload label
      command: kubectl label nodes k3d-{{ molecule_cluster_name }}-server-0 workload=gitlab

    - name: Add MinIO Helm repository
      kubernetes.core.helm_repository:
        name: minio
        repo_url: https://charts.min.io/

    - name: Deploy MinIO with Helm
      kubernetes.core.helm:
        name: minio
        chart_ref: minio/minio
        release_namespace: default
        values:
          mode: standalone
          persistence:
            enabled: true
            size: 1Gi
          buckets:
            - name: gitlab
              policy: none
              purge: false
          resources:
            requests:
              memory: 256Mi
              cpu: 100m

    - name: Get MinIO credentials from secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: minio
        namespace: default
      register: minio_secret

    - name: Set MinIO credentials as facts
      set_fact:
        minio_root_user: "{{ minio_secret.resources[0].data['rootUser'] | b64decode }}"
        minio_root_password: "{{ minio_secret.resources[0].data['rootPassword'] | b64decode }}"

    - name: Create MinIO service account
      shell: |
        kubectl exec $(kubectl get pods -l app=minio -n default -o jsonpath='{.items[0].metadata.name}') -n default -- sh -c 'mc alias set local http://localhost:9000 {{ minio_root_user }} {{ minio_root_password }} 2>/dev/null || true; mc admin user svcacct add local {{ minio_root_user }} --access-key {{ minio_access_key }} --secret-key {{ minio_secret_key }}'

    - name: Configure MinIO secret - Buckets
      kubernetes.core.k8s:
        state: present
        definition:
          kind: Secret
          type: Opaque
          metadata:
            name: "gitlab-minio-secret"
            namespace: default
          stringData:
            key: |-
              provider: "AWS"
              region: "us-east-1"
              aws_access_key_id: "{{ minio_access_key }}"
              aws_secret_access_key: "{{ minio_secret_key }}"
              host: "minio.default.svc.cluster.local"
              aws_signature_version: "4"
              endpoint: "http://minio.default.svc.cluster.local:9000"
              path_style: "true"

    - name: Configure MinIO secret - Backups
      kubernetes.core.k8s:
        name: gitlab-minio-backup-secret
        api_version: v1
        kind: Secret
        namespace: default
        definition:
          type: Opaque
          data:
            accesskey: "{{ minio_access_key | b64encode }}"
            secretkey: "{{ minio_secret_key | b64encode }}"
        state: present
