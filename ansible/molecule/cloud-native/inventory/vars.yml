all:
  vars:
    external_url: "http://docker"
    external_ip: 127.0.0.1
    cloud_provider: none

    kubeconfig_setup: true
    cloud_native_hybrid_environment: true
    cloud_native_hybrid_monitoring_setup: true
    gitlab_charts_show_values: true

    postgres_host: "postgres-external"
    postgres_username: "postgres"
    postgres_password: "{{ lookup('env','MOLECULE_POSTGRES_ADMIN_PASSWORD') }}"

    redis_host: "redis-external"

    gitlab_charts_gitaly_node_selector: gitlab
    gitlab_charts_sidekiq_node_selector: gitlab
    gitlab_charts_supporting_node_selector: gitlab
    gitlab_charts_webservice_node_selector: gitlab

    gitlab_charts_webservice_max_replicas: 1
    gitlab_charts_sidekiq_max_replicas: 1
    gitlab_charts_webservice_requests_cpu: 1

    gitlab_charts_gitaly_setup: true
    gitlab_charts_gitaly_requests_memory_gb: 1
    gitlab_charts_gitaly_limits_memory_gb: 1
    gitlab_charts_gitaly_requests_cpu: 1
    gitlab_charts_gitaly_limits_cpu: 1
    gitlab_charts_gitaly_storage_size: '100M'
    gitlab_charts_gitaly_cgroups_memory_bytes: 8589934592
    gitlab_charts_gitaly_storage_names: ['default']

    molecule_scenario: cloud-native
    molecule_network_name: "molecule_{{ molecule_scenario | replace('-', '_') }}_network"
    molecule_cluster_name: "molecule-{{ molecule_scenario }}"
    gitlab_charts_custom_context: k3d-"{{ molecule_cluster_name }}"

    custom_config_folder: "{{ lookup('env', 'PWD') }}/molecule/gitlab_configs"
    custom_tasks_folder: "{{ lookup('env', 'PWD') }}/molecule/gitlab_tasks"
    gitlab_charts_custom_config_file: "{{ custom_config_folder }}/gitlab_charts.yml.j2"

    gitlab_root_password: "{{ lookup('env','MOLECULE_GITLAB_ROOT_PASSWORD') }}"
    gitaly_token: "{{ lookup('env','MOLECULE_GITALY_TOKEN') }}"
    redis_password: "{{ lookup('env','MOLECULE_REDIS_PASSWORD') }}"

    # OpenBao configs
    openbao_external_url: "http://openbao.docker"
    openbao_database_password: "open8aot3st"
    gitlab_charts_openbao_requests_memory: '128Mi'
    gitlab_charts_openbao_limits_memory: "128Mi"
    gitlab_charts_openbao_requests_cpu: '100m'
    gitlab_charts_openbao_limits_cpu: "100m"
    gitlab_charts_openbao_min_replicas: 2
    gitlab_charts_openbao_max_replicas: 4
