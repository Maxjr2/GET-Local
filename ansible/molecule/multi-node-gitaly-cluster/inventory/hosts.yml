          ansible_connection: community.docker.docker
          docker_daemon_options:
            storage-driver: "native"
    praefect:
      children:
        praefect_primary:
          hosts:
            praefect-1:
              ansible_connection: community.docker.docker
        praefect_secondary:
          hosts:
            praefect-2:
              ansible_connection: community.docker.docker
            praefect-3:
              ansible_connection: community.docker.docker
