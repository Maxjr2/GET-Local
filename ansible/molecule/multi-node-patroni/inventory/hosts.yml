all:
  children:
    consul:
      hosts:
        consul-1:
          ansible_connection: community.docker.docker
        consul-2:
          ansible_connection: community.docker.docker
        consul-3:
          ansible_connection: community.docker.docker
    gitlab_rails:
      children:
        gitlab_rails_primary:
          hosts:
            gitlab-rails-1:
              ansible_connection: community.docker.docker
    haproxy_external:
      hosts:
        haproxy-external-1:
          ansible-connection: community.docker.docker
          docker_daemon_options:
            storage-driver: "native"
    haproxy_internal:
      hosts:
        haproxy-internal-1:
          ansible-connection: community.docker.docker
          docker_daemon_options:
            storage-driver: "native"
    pgbouncer:
      hosts:
        pgbouncer-1:
          ansible_connection: community.docker.docker
        pgbouncer-2:
          ansible_connection: community.docker.docker
        pgbouncer-3:
          ansible_connection: community.docker.docker
    postgres:
      children:
        postgres_primary:
          hosts:
            postgres-1:
              ansible_connection: community.docker.docker
        secondary:
          hosts:
            postgres-2:
              ansible_connection: community.docker.docker
            postgres-3:
              ansible_connection: community.docker.docker
