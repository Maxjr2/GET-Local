all:
  vars:
    external_url: "http://docker"
    cloud_provider: none

    custom_config_folder: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(lookup('env', 'PWD'), true) }}/molecule/gitlab_configs"
    custom_tasks_folder: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | default(lookup('env', 'PWD'), true) }}/molecule/gitlab_tasks"

    # Triggers the conditional Python package install block to verify system packages install correctly
    postgres_external: true

    # Workaround: https://github.com/docker/cli/issues/6646
    docker_daemon_options: >-
      {{
        {} if (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '20.04') or
              (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] | int == 8)
        else {'storage-driver': 'native'}
      }}
