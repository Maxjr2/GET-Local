all:
  vars:
    external_url: "http://docker"
    cloud_provider: none

    custom_config_folder: "{{ lookup('env', 'PWD') }}/molecule/gitlab_configs"
    custom_tasks_folder: "{{ lookup('env', 'PWD') }}/molecule/gitlab_tasks"

    # Workaround: https://github.com/docker/cli/issues/6646
    docker_daemon_options: "{{ {'storage-driver': 'native'} if not (ansible_distribution == 'Ubuntu' and ansible_distribution_version == '20.04') else {} }}"
