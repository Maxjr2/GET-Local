---
- name: Prepare OS hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Remove curl-minimal package on Rocky Linux
      ansible.builtin.dnf:
        name: curl-minimal
        state: absent
      when:
        - ansible_distribution == "Rocky"
        - ansible_distribution_major_version | int == 9

    - name: Fix /etc/shadow permissions on Rocky Linux # https://github.com/geerlingguy/docker-rockylinux9-ansible/issues/6
      ansible.builtin.file:
        path: /etc/shadow
        mode: '400'
      when:
        - ansible_distribution == "Rocky"
        - ansible_distribution_major_version | int >= 9

    - name: Install needed packages for Amazon Linux 2023
      ansible.builtin.package:
        name:
          - tar
          - iproute # https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_vars_facts.html#package-requirements-for-fact-gathering
        state: present
      when: ansible_facts['distribution'] == "Amazon"

    - name: Re-gather facts after package installation (Amazon Linux 2023)
      ansible.builtin.setup:
      when: ansible_facts['distribution'] == "Amazon"
