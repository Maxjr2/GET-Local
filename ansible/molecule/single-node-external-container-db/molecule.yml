---
driver:
  name: docker
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ./inventory
  env:
    ANSIBLE_ROLES_PATH: ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:../../roles
    ANSIBLE_CONFIG: ../../ansible.cfg
    ANSIBLE_COLLECTIONS_DUPLICATE_WARNINGS: false
    MOLECULE_DISPLAY_MISSING_SCHEMA: false
    ANSIBLE_GALAXY_DISPLAY_SKIPPED: false
platforms:
  - &default_platform
    name: gitlab-rails-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    pre_build_image: true
    privileged: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    docker_networks:
      - name: molecule_network
        ipam_config:
          - subnet: 192.168.49.0/24
            gateway: 192.168.49.1
    network_mode: "molecule_network"
    networks:
      - name: molecule_network
        ipv4_address: 192.168.49.50
  - <<: *default_platform
    name: haproxy-external-1
    published_ports:
      - 0.0.0.0:80:80/udp
      - 0.0.0.0:80:80/tcp
      - 0.0.0.0:443:443/udp
      - 0.0.0.0:443:443/tcp
      - 0.0.0.0:1936:1936/udp
      - 0.0.0.0:1936:1936/tcp
    network_mode: "molecule_network"
    networks:
      - name: molecule_network
        ipv4_address: 192.168.49.51
  - name: aux-db
    image: postgres:latest
    command: ["docker-entrypoint.sh", "postgres"]
    network_mode: "molecule_network"
    networks:
      - name: molecule_network
        ipv4_address: 192.168.49.52
    exposed_ports:
      - 5432/tcp
    published_ports:
      - 0.0.0.0:5432:5432/tcp
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${MOLECULE_POSTGRES_ADMIN_PASSWORD}"
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
