- name: Verify
  hosts: all
  tasks:
    - name: Wait for GitLab to be Available
      uri:
        url: "{{ external_url }}/-/readiness"
        validate_certs: false
        timeout: 60
      register: gitlab_status
      until: gitlab_status.status == 200
      retries: 30
      delay: 10
      delegate_to: localhost
      when:
        - ('gitlab-rails' in inventory_hostname)
        - ('site2' in inventory_hostname)

    - name: Check if secondary node was promoted to primary
      command: |
        gitlab-rails runner "puts Gitlab::Geo.primary?"
      become: true
      register: geo_primary
      failed_when: geo_primary.stdout != "true"
      changed_when: false
      when:
        - ('gitlab-rails' in inventory_hostname)
        - ('site2' in inventory_hostname)
