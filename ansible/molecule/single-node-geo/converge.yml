---
- name: Configure GitLab
  hosts: localhost
  vars:
    playbook_path: ../../playbooks/all.yml
  tasks:
    - name: Run all.yml for site1
      command: ansible-playbook -i ./inventories/site1 {{ playbook_path }}
      ignore_errors: true
      no_log: true
      async: 3600
      poll: 0
      register: site1_playbook_run

    - name: Run all.yml for site2
      command: ansible-playbook -i ./inventories/site2 {{ playbook_path }}
      ignore_errors: true
      no_log: true
      async: 3600
      poll: 0
      register: site2_playbook_run

    - name: Wait for playbooks
      async_status:
        jid: "{{ item.ansible_job_id }}"
      ignore_errors: true
      no_log: true
      loop:
        - "{{ site1_playbook_run }}"
        - "{{ site2_playbook_run }}"
      register: job_result
      until: job_result.finished
      retries: 100
      delay: 30

    - name: Get playbook output for site1
      set_fact:
        site1_log: "{{ lookup('file', site1_playbook_run.results_file) | from_json }}"

    - name: Parse site1 log
      shell: echo "{{ site1_log.stdout }}"
      register: site1_parsed

    - name: Show playbook output for site1
      debug:
        msg: "{{ site1_parsed.stdout_lines }}"

    - name: Get playbook output for site2
      set_fact:
        site2_log: "{{ lookup('file', site2_playbook_run.results_file) | from_json }}"

    - name: Parse site2 log
      shell: echo "{{ site2_log.stdout }}"
      register: site2_parsed

    - name: Show playbook output for site2
      debug:
        msg: "{{ site2_parsed.stdout_lines }}"

    - name: Fail if all.yml failed
      fail:
        msg: "Error: all.yml failed on one or more sites."
      when: site1_playbook_run.failed or site2_playbook_run.failed

- import_playbook: ../../playbooks/gitlab_geo.yml
