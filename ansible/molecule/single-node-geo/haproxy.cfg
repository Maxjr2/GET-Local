global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    retries 3
    timeout connect 30s
    timeout client 305s
    timeout server 305s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen stats
    bind *:1936
    mode http
    stats enable
    stats uri /
    stats refresh 10s

frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/ssl/

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Ssl on if { ssl_fc }

    acl site1-registry hdr(host) -i registry.site1.docker
    use_backend site1-registry if site1-registry

    use_backend site1_backend if { req_ssl_sni -i site1.docker }
    use_backend site2_backend if { req_ssl_sni -i site2.docker }

    default_backend site1_backend

backend site1_backend
    option httpchk GET /-/readiness
    option forwardfor
    redirect scheme https if !{ ssl_fc }

    server site1 site1-gitlab-rails-1:80 check inter 3s fall 1 resolvers docker init-addr last,libc,none

backend site2_backend
    option httpchk GET /-/readiness
    option forwardfor
    redirect scheme https if !{ ssl_fc }

    server site2 site2-gitlab-rails-1:80 check inter 3s fall 1 resolvers docker init-addr last,libc,none

backend site1-registry
    option forwardfor
    redirect scheme https if !{ ssl_fc }

    server site1 site1-gitlab-rails-1:80 check inter 3s fall 1 resolvers docker init-addr last,libc,none
