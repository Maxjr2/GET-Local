all:
  vars:
    external_url: "http://docker"
    cloud_provider: none

    geo_primary_external_url: "http://docker"
    geo_primary_internal_url: "http://docker"
    geo_primary_site_group_name: "site1"
    geo_primary_site_name: "Site 1"

    gitlab_license_text: "{{ lookup('env', 'EE_LICENSE') }}"

    common_custom_tasks_file: "{{ lookup('env', 'PWD') }}/../gitlab_tasks/common.yml"
    gitlab_rails_custom_config_file: "{{ lookup('env', 'PWD') }}/../gitlab_configs/gitlab_rails.rb.j2"

    gitlab_root_password: "{{ lookup('env','MOLECULE_GITLAB_ROOT_PASSWORD') }}"
    postgres_password: "{{ lookup('env','MOLECULE_POSTGRES_PASSWORD') }}"
