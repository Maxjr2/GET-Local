---
driver:
  name: docker
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ./inventories
  config_options:
    defaults:
      display_skipped_hosts: false
      stdout_callback: yaml
  env:
    ANSIBLE_ROLES_PATH: ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:../../roles
    ANSIBLE_COLLECTIONS_DUPLICATE_WARNINGS: false
    MOLECULE_DISPLAY_MISSING_SCHEMA: false
    ANSIBLE_GALAXY_DISPLAY_SKIPPED: false
platforms:
  - &default_platform
    name: site1-gitlab-rails-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    pre_build_image: true
    privileged: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    network_mode: "molecule_network"
    networks:
      - name: molecule_network
    published_ports:
      - 0.0.0.0:80:80/udp
      - 0.0.0.0:80:80/tcp
  - <<: *default_platform
    name: site2-gitlab-rails-1
    published_ports:
      - 0.0.0.0:81:80/udp
      - 0.0.0.0:81:80/tcp
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
