---
driver:
  name: docker
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ./inventories
  env:
    ANSIBLE_ROLES_PATH: ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:../../roles
    ANSIBLE_CONFIG: ../../ansible.cfg
    ANSIBLE_COLLECTIONS_DUPLICATE_WARNINGS: false
    MOLECULE_DISPLAY_MISSING_SCHEMA: false
    ANSIBLE_GALAXY_DISPLAY_SKIPPED: false
platforms:
  - &default_platform
    name: site1-gitlab-rails-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    pre_build_image: true
    privileged: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    network_mode: "molecule_network"
    networks:
      - name: molecule_network
  - <<: *default_platform
    name: site2-gitlab-rails-1
  - name: geo-lb
    image: haproxy:latest
    pre_build_image: true
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    volumes:
      - "${PWD}/molecule/single-node-geo/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
      - "${MOLECULE_COMBINED_CERTIFICATE}:/usr/local/etc/haproxy/ssl/docker-combined.pem:ro"
    network_mode: "molecule_network"
    networks:
      - name: molecule_network
    published_ports:
      - 0.0.0.0:443:443/tcp
      - 0.0.0.0:1936:1936/tcp
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
