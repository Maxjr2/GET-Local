---
- name: Verify GitLab installation
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if GitLab configuration files exist
      stat:
        path: "{{ item }}"
      register: gitlab_config_files
      failed_when: not gitlab_config_files.stat.exists
      loop:
        - /etc/gitlab/gitlab.rb
        - /etc/gitlab/skip-auto-reconfigure
        - /etc/gitlab/skip-fail-config-check

    - name: Get GitLab component status
      command: gitlab-ctl status
      register: gitlab_status
      changed_when: false

    - name: Display GitLab service status
      debug:
        msg: "{{ gitlab_status.stdout_lines }}"

    - name: Verify GitLab components are running
      assert:
        that:
          - "'run:' in gitlab_status.stdout"
          - "'down:' not in gitlab_status.stdout"
        fail_msg: "Some GitLab components are not running"
        success_msg: "All GitLab components are running"

    - name: Check specific GitLab services are running
      shell: |
        gitlab-ctl status | grep -E "(nginx|postgresql|redis|sidekiq|puma|gitaly)" | grep -v "down:"
      register: core_services
      changed_when: false
      failed_when: core_services.rc != 0
