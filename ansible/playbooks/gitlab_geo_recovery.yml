---
# Omnibus or Cloud Native Hybrid
- hosts: all:!gitlab_*_node_pool:!ungrouped:!get_ignored
  become: true
  roles:
    - common_vars
  tasks:
    - name: Run GitLab Geo Recovery
      import_role:
        name: gitlab_geo
        tasks_from: recovery
      when: groups | select('match', 'gitaly|gitlab_rails') | length > 0

# Cloud Native with no Omnibus backends
- hosts: localhost
  roles:
    - common_vars
  tasks:
    - name: Run GitLab Geo Recovery
      import_role:
        name: gitlab_geo
        tasks_from: recovery
      when: groups | select('match', 'gitaly|gitlab_rails') | length == 0
