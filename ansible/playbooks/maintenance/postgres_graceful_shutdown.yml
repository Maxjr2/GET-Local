---
# Performs full graceful shutdown of PostgreSQL if required by ensuring no partial failover is triggered
# Stops secondaries first and then the primary
- hosts: postgres
  become: true
  order: sorted
  roles:
    - common_vars
  tasks:
    - name: Perform graceful PostgreSQL HA shutdown
      block:
        - name: Get latest PostgreSQL leader
          command: gitlab-ctl get-postgresql-primary
          register: postgres_leader_int_address
          run_once: true

        - name: Stop if secondary
          command: gitlab-ctl stop patroni
          when: (ansible_default_ipv4.address != postgres_leader_int_address.stdout.split(':')[0])

        - name: Stop if primary
          command: gitlab-ctl stop patroni
          when: (ansible_default_ipv4.address == postgres_leader_int_address.stdout.split(':')[0])
      when: (groups['postgres'] | length > 1)
