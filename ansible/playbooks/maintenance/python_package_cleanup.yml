---
# Removes no longer needed Python packages as a once off
- hosts: all:!gitlab_*_node_pool:!ungrouped:!get_ignored
  become: true
  order: sorted
  roles:
    - common_vars
  tasks:
    - name: Remove unneeded Python packages
      pip:
        name: [google-auth, openshift, PyYAML, docker]
        state: absent
