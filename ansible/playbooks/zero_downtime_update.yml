---
- import_playbook: playbook_prep.yml

- hosts: all:!praefect_postgres:!gitlab_nfs:!haproxy_*:!gitlab_*_node_pool:!ungrouped:!get_ignored
  order: sorted
  environment: "{{ remote_env }}"
  roles:
    - zero_downtime_upgrade
  become: true

- hosts: localhost
  gather_facts: false
  vars:
    gitlab_charts_zero_downtime_update: true
  roles:
    - { role: gitlab_charts, when: "cloud_native_hybrid_environment" }

- import_playbook: post_configure.yml
