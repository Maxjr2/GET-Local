---
# Packages
system_packages_deb: [aptitude, curl, ca-certificates, tzdata]

system_packages_rpm: ['curl', 'ca-certificates', 'tzdata', 'yum-plugin-versionlock']
system_packages_amazon:
  '2': "{{ system_packages_rpm + ['python3-pip', 'postgresql-devel'] }}"
  '2023': "{{ system_packages_rpm | difference(['curl']) }}"

system_packages_upgrade: "{{ lookup('env','SYSTEM_PACKAGES_UPGRADE') | default(false, true) }}"
system_packages_autoremove: "{{ lookup('env','SYSTEM_PACKAGES_AUTOREMOVE') | default(false, true) }}"
system_packages_auto_security_upgrade: "{{ lookup('env','SYSTEM_PACKAGES_AUTO_SECURITY_UPGRADE') | default(true, true) }}"

## EPEL
epel_setup: false
epel_gpg_key_url: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
epel_rpm_url: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"

# Python packages - installed conditionally on nodes with external database or Geo configurations
system_python_packages_deb: [python3-psycopg2, python3-pexpect]
system_python_packages_rhel: ['python3-psycopg2', 'python3-pexpect', 'python3-requests']
system_python_packages_amazon: ['python3-psycopg2', 'python3-pexpect']

# AL2 only - python3-psycopg2/python3-pexpect not available as system packages, installed via pip
# urllib3 pinned to 1.x: https://urllib3.readthedocs.io/en/latest/v2-migration-guide.html#ssl-module-is-compiled-with-openssl-1-0-2-k-fips
python_packages_amazon_al2: [psycopg2, pexpect, requests, 'urllib3<2.0.0']

# GitLab Package
## Repo
gitlab_repo_package_version_syntax: "{{ '-' if ansible_facts['os_family'] == 'RedHat' else '=' }}"
gitlab_repo_package: "{{ lookup('env','GITLAB_REPO_PACKAGE') | default(gitlab_edition + gitlab_repo_package_version_syntax + gitlab_version + '*' if gitlab_version != '' else gitlab_edition, true) }}"
gitlab_repo_script_name: {Debian: 'script.deb.sh', RedHat: 'script.rpm.sh'}
gitlab_repo_script_url: "{{ lookup('env','GITLAB_REPO_SCRIPT_URL') | default('https://packages.gitlab.com/install/repositories/gitlab/' + gitlab_edition + '/' + gitlab_repo_script_name[ansible_facts['os_family']], true) }}"
gitlab_repo_script_path: "/tmp/gitlab_install_repository.sh"
gitlab_repo_list_path: {Debian: "/etc/apt/sources.list.d/{{ 'gitlab_' + ('nightly-builds' if 'nightly' in gitlab_repo_script_url else gitlab_edition) }}.list", RedHat: "/etc/yum.repos.d/gitlab_{{ gitlab_edition }}.repo"}

gitlab_repo_package_allow_downgrade: false

## Deb
gitlab_deb_host_path: "{{ lookup('env','GITLAB_HOST_DEB_PATH') }}"

gitlab_deb_download_url: "{{ lookup('env','GITLAB_DEB_DOWNLOAD_URL') }}"
gitlab_deb_download_url_headers: "{{ lookup('env','GITLAB_DEB_DOWNLOAD_URL_HEADERS') | default({}, true) }}"
gitlab_deb_target_path: "{{ lookup('env','GITLAB_TARGET_DEB_PATH') | default('/tmp/gitlab_deb_package.deb', true) }}"

gitlab_deb_allow_downgrade: "{{ true if gitlab_deb_force_install is defined and gitlab_deb_force_install else false }}"

## RPM
gitlab_rpm_host_path: "{{ lookup('env','GITLAB_HOST_RPM_PATH') }}"

gitlab_rpm_download_url: "{{ lookup('env','GITLAB_RPM_DOWNLOAD_URL') }}"
gitlab_rpm_download_url_headers: "{{ lookup('env','GITLAB_RPM_DOWNLOAD_URL_HEADERS') | default({}, true) }}"
gitlab_rpm_target_path: "{{ lookup('env','GITLAB_TARGET_RPM_PATH') | default('/tmp/gitlab_rpm_package.rpm', true) }}"

gitlab_rpm_allow_downgrade: false

## Downgrade Prerequisites met flag
### Downgrades require prerequisites to be in place beforehand - https://docs.gitlab.com/ee/update/package/downgrade.html
### Failure to not have prerequisites will result in a broken environment and potential data loss.
### Once prerequisitves are in place rerun with gitlab_downgrade_prerequisites_met set to 'true' at your own risk
gitlab_downgrade_prerequisites_met: false

# Secrets
gitlab_secrets_write: true
gitlab_secrets_post_reconfigure: false

gitlab_custom_secrets_json: ""

# GPG
gitlab_gpg_key_url: https://packages.gitlab.com/gpgkey/gpg.key

# Data Disks
## GCP gives an ID that can be used as an alias to the device name
## AWS gives no ID and requires the block device path
disk_device_prefix:
  azure: "/dev/disk/azure/scsi1/lun"
  gcp: "/dev/disk/by-id/google-"
  aws: "/dev/"

mkfs_opts: "-m 0 -F -E lazy_itable_init=0,lazy_journal_init=0,discard"
mount_opts: "discard,defaults"
mount_state: mounted

# Data Disks detection
group_data_disks_name: "{{ lookup('vars', ('labels' if cloud_provider == 'gcp' else 'tags'), default = {}).gitlab_node_type | default('') | replace('-', '_') }}"
group_data_disks: "{{ lookup('vars', group_data_disks_name + '_data_disks', default=[]) if group_data_disks_name != '' else [] }}"

## Each entry should be an array of hashes in the below format specifying the
## disk device name and mount dir for the target group
## Example:
## gitaly_data_disks:
##  - { device_name: 'data', mount_dir: '/var/opt/gitlab' }
##  - { device_name: 'log', mount_dir: '/var/log/gitlab' }

consul_data_disks: []
postgres_data_disks: []
pgbouncer_data_disks: []
redis_data_disks: []
redis_cache_data_disks: []
redis_persistent_data_disks: []
praefect_postgres_data_disks: []
praefect_data_disks: []
gitaly_data_disks: []
gitlab_rails_data_disks: []
sidekiq_data_disks: []
monitor_data_disks: []
haproxy_external_disks: []
haproxy_internal_disks: []
gitlab_nfs_disks: []

# Cloud Provider settings

aws_set_hostnames: true
