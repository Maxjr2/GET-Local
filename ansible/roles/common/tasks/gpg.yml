---
# Update GPG keys
- name: Install gnupg (Debian)
  apt:
    name: "gnupg"
    update_cache: true
  register: result
  retries: 20
  delay: 5
  until: result is success
  when: ansible_facts['distribution'] == "Debian"

- name: Update GitLab repository GPG key (Ubuntu / Debian)
  block:
    - name: Get signed-by GPG key path from existing repo list file if present
      shell: awk '/deb \[signed-by=/{ pubkey = $2; sub(/\[signed-by=/, "", pubkey); sub(/\]$/, "", pubkey); print pubkey }' {{ gitlab_repo_list_path[ansible_facts['os_family']] }}
      register: gitlab_signed_by_gpg_key_path

    - name: Update signed-by GPG key if present
      shell: curl -s {{ gitlab_gpg_key_url }} | gpg --dearmor > {{ gitlab_signed_by_gpg_key_path.stdout }}
      when: gitlab_signed_by_gpg_key_path.stdout != ''

    - name: Update GPG key via apt-key if used
      shell: curl -s {{ gitlab_gpg_key_url }} | apt-key add -
      register: result
      retries: 2
      delay: 3
      until: result is success
      when: gitlab_signed_by_gpg_key_path.stdout == ''

    - name: Run apt update
      command: sudo apt-get update
  when: ansible_facts['os_family'] == "Debian"

# Install the key on every run to ensure content changes (e.g. expiry extensions) are picked up.
- name: Update GitLab repository GPG key (RHEL)
  block:
    - name: Create temporary file for GitLab GPG key (RHEL)
      tempfile:
        suffix: .key
      register: gitlab_gpg_key_tmp

    - name: Download GitLab GPG key (RHEL)
      get_url:
        url: "{{ gitlab_gpg_key_url }}"
        dest: "{{ gitlab_gpg_key_tmp.path }}"
        mode: '0644'
      register: result
      retries: 2
      delay: 3
      until: result is success

    - name: Remove existing GitLab GPG key if present (RHEL)
      rpm_key:
        key: "{{ gitlab_gpg_key_tmp.path }}"
        state: absent
      ignore_errors: true

    - name: Import GitLab GPG key (RHEL)
      rpm_key:
        key: "{{ gitlab_gpg_key_tmp.path }}"
        state: present
      register: result
      retries: 2
      delay: 3
      until: result is success

  always:
    - name: Remove temporary GitLab GPG key file (RHEL)
      file:
        path: "{{ gitlab_gpg_key_tmp.path }}"
        state: absent
      when: gitlab_gpg_key_tmp.path is defined

  when: ansible_facts['os_family'] == 'RedHat'
