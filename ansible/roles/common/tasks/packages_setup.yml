---
# Debian
- name: Install system packages (Ubuntu / Debian)
  apt:
    name: "{{ system_packages_deb }}"
    update_cache: true
  register: result
  retries: 60
  delay: 5
  until: result is success
  when: ansible_facts['os_family'] == "Debian"

# RHEL
- name: Setup EPEL Repo (RHEL)
  block:
    - name: Setup EPEL GPG key (RHEL)
      command: rpm --import {{ epel_gpg_key_url }}
      register: result
      retries: 5
      delay: 5
      until: result is success
      changed_when: false

    - name: Setup EPEL Repo (RHEL)
      yum:
        name: "{{ epel_rpm_url }}"
      register: result
      retries: 5
      delay: 5
      until: result is success
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Amazon'
    - not offline_setup
    - epel_setup

- name: Install system packages (RHEL)
  yum:
    name: "{{ system_packages_rpm }}"
    update_cache: true
  register: result
  retries: 60
  delay: 5
  until: result is success
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'Amazon'

- name: Setup EPEL Repo (Amazon Linux 2)
  command: amazon-linux-extras install epel -y
  when:
    - ansible_facts['distribution'] == 'Amazon'
    - ansible_facts['distribution_major_version'] == '2'
    - not offline_setup
    - epel_setup

# For more recent PG Client Libraries on Amazon Linux 2 only. Version doesn't need to match PG Server.
- name: Enable PostgreSQL Client Repo (Amazon Linux 2)
  command: amazon-linux-extras enable postgresql13 -y
  when:
    - ansible_facts['distribution'] == 'Amazon'
    - ansible_facts['distribution_major_version'] == '2'
    - not offline_setup

- name: Install system packages (Amazon Linux)
  yum:
    name: "{{ system_packages_amazon[ansible_facts['distribution_major_version']] }}"
    update_cache: true
  register: result
  retries: 60
  delay: 5
  until: result is success
  when: ansible_facts['distribution'] == 'Amazon'

# Python packages are only installed on nodes with external database or Geo configurations
- name: Install Python packages
  block:
    - name: Install Python packages (Debian/Ubuntu)
      apt:
        name: "{{ system_python_packages_deb }}"
      register: result
      retries: 60
      delay: 5
      until: result is success
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install Python packages (RHEL)
      yum:
        name: "{{ system_python_packages_rhel }}"
      register: result
      retries: 60
      delay: 5
      until: result is success
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - ansible_facts['distribution'] != 'Amazon'

    - name: Install Python packages (Amazon Linux 2023)
      yum:
        name: "{{ system_python_packages_amazon }}"
      register: result
      retries: 60
      delay: 5
      until: result is success
      when:
        - ansible_facts['distribution'] == 'Amazon'
        - ansible_facts['distribution_major_version'] == '2023'

    # AL2 only - python3-psycopg2 and python3-pexpect not available as system packages
    - name: Install Python packages (Amazon Linux 2)
      pip:
        name: "{{ python_packages_amazon_al2 }}"
        extra_args: "--upgrade-strategy only-if-needed"
      when:
        - ansible_facts['distribution'] == 'Amazon'
        - ansible_facts['distribution_major_version'] == '2'
  when: postgres_external or praefect_postgres_external or geo_tracking_postgres_external or geo_secondary_site_group_name in groups or geo_primary_site_group_name in groups

