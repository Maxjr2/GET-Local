---
# Propagate secrets
#
# Collects secrets once from the first available Omnibus host and propagates to all nodes.
# 
# Collection happens at two points:
#   1. Pre-reconfigure: If gitlab-secrets.json already exists on disk
#   2. Post-reconfigure: After first node reconfigures to capture newly generated secrets
#
# Post-reconfigure writes are only done for nodes sharing groups with the source node to ensure
# correct propagation within the same service group. Other service groups receive the collected
# secrets via pre-reconfigure write, then add their own node-specific secrets during reconfigure.
#
# As a safeguard, all component playbooks depend on playbook_prep.yml running first to ensure
# secrets are collected from any available node before service-specific execution begins.
#
# Custom GitLab secrets can be merged into collected secrets via gitlab_custom_secrets_json.

- name: Collect GitLab Secrets
  block:
    - name: Check if GitLab Secrets file exists
      stat:
        path: "/etc/gitlab/gitlab-secrets.json"
      register: gitlab_secrets_file_path

    - name: Lookup GitLab Secrets file from first node
      slurp:
        path: "/etc/gitlab/gitlab-secrets.json"
      register: gitlab_secrets_slurp
      no_log: true
      when: gitlab_secrets_file_path.stat.exists

    - name: Save GitLab Secrets file contents
      set_fact:
        gitlab_secrets_json: "{{ gitlab_secrets_slurp.content | b64decode | from_yaml }}"
        gitlab_secrets_source_node_group_names: "{{ group_names }}"
      delegate_to: localhost
      delegate_facts: true
      become: false
      no_log: true
      when: gitlab_secrets_file_path.stat.exists
  run_once: true
  # Also re-collect on the post-reconfigure pass if it hasn't fired yet — prevents double-collection.
  when: hostvars['localhost'].gitlab_secrets_json is not defined or
        (hostvars['localhost'].gitlab_secrets_collected_post_reconfigure is not defined and gitlab_secrets_post_reconfigure)
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Merge in Custom Secrets if given
  set_fact:
    gitlab_secrets_json: "{{ hostvars['localhost'].gitlab_secrets_json | combine(gitlab_custom_secrets_json | from_yaml, recursive=True) }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  no_log: true
  run_once: true
  when:
    - gitlab_custom_secrets_json != ""
    - hostvars['localhost'].gitlab_secrets_json is defined
    - hostvars['localhost'].gitlab_secrets_collected_post_reconfigure is not defined
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Mark that secrets have been collected after first reconfigure
  set_fact:
    gitlab_secrets_collected_post_reconfigure: "{{ gitlab_secrets_post_reconfigure }}"
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  when:
    - gitlab_secrets_post_reconfigure
    - hostvars['localhost'].gitlab_secrets_collected_post_reconfigure is not defined
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Write GitLab Secrets
  block:
    - name: Write GitLab Secrets file
      copy:
        content: "{{ (hostvars['localhost'].gitlab_secrets_json | to_json(indent=2)) }}\n"
        dest: "/etc/gitlab/gitlab-secrets.json"
        owner: root
        group: root
        mode: '0600'
      register: gitlab_secrets_file_copy
      no_log: true
      diff: false

    - name: Reconfigure after secrets change if required
      command: gitlab-ctl reconfigure
      register: result
      retries: 3
      until: result is success
      when:
        - gitlab_secrets_file_copy.changed
        - gitlab_secrets_post_reconfigure
  # Post-reconfigure: only write back to nodes sharing a group with the source node, so each service
  # group picks up its own newly generated secrets without overwriting secrets from other groups.
  when:
    - gitlab_secrets_write
    - hostvars['localhost'].gitlab_secrets_json is defined
    - not gitlab_secrets_post_reconfigure or 
      (hostvars['localhost'].gitlab_secrets_source_node_group_names | default([]) | intersect(group_names) | length > 0)
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets
