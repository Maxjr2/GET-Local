---
- name: Run gitlab-ctl cleanse against all Omnibus nodes
  command: gitlab-ctl cleanse
  register: result
  failed_when:
    - result.rc != 0
    - ('No such file or directory' not in result.msg)

- name: Unlock GitLab package installs
  command: "{{ 'yum versionlock delete' if ansible_facts['os_family'] == 'RedHat' else 'aptitude unhold' }} {{ gitlab_edition }}"
  retries: 60
  delay: 5
  register: result

- name: Uninstall GitLab repo package
  package:
    name: "{{ gitlab_repo_package }}"
    state: absent
  register: result
  retries: 2
  delay: 3

- name: Remove GitLab repository and keys (Ubuntu / Debian)
  block:
    - name: Remove GitLab repository file (Ubuntu / Debian)
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/gitlab_{{ gitlab_edition }}.list"
        state: absent

    - name: Remove GitLab GPG keyring (Ubuntu / Debian)
      ansible.builtin.file:
        path: "/usr/share/keyrings/gitlab_{{ gitlab_edition }}-archive-keyring.gpg"
        state: absent

    - name: Update apt cache after repository removal (Ubuntu / Debian)
      ansible.builtin.apt:
        update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Remove GitLab repository and keys (RHEL)
  block:
    - name: Remove GitLab yum repository (RHEL)
      yum_repository:
        name: "{{ item }}"
        file: "gitlab_{{ gitlab_edition }}"
        state: absent
      loop:
        - "gitlab_{{ gitlab_edition }}"
        - "gitlab_{{ gitlab_edition }}-source"

    - name: Find GitLab GPG key in RPM keyring (RHEL)
      ansible.builtin.shell: >
        rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} %{summary}\n' |
        awk '/[Gg]it[Ll]ab/{print $1}'
      register: gitlab_gpg_key_pkg
      changed_when: false
      failed_when: false

    - name: Remove GitLab GPG key from RPM keyring (RHEL)
      ansible.builtin.command: rpm -e {{ item }}
      loop: "{{ gitlab_gpg_key_pkg.stdout_lines }}"
      when: gitlab_gpg_key_pkg.stdout_lines | length > 0
  when: ansible_facts['os_family'] == 'RedHat'

- name: Remove the repository script file
  file:
    path: "{{ gitlab_repo_script_path }}"
    state: absent
