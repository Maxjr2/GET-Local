gitaly_number: "{{ inventory_hostname | regex_search('gitaly-(\\d+)', '\\1') | first }}"
gitaly_ruby_num_workers: "{{ [(ansible_processor_vcpus * 0.2) | round | int, 2] | max }}"

gitaly_pack_objects_cache: true
gitaly_node: "gitaly-{{ gitaly_number }}"

gitaly_cluster_storage_path: "/var/opt/gitlab/git-data"
gitaly_sharded_storage_path: "{{ '/mnt/gitlab' if cloud_provider != 'azure' else '/var/opt/gitlab/git-data' }}"

gitaly_callback_internal_api_url: "{{ (('https://' if gitlab_rails_nginx_ssl else 'http://') + internal_lb_host) if 'haproxy_internal' in groups and 'gitlab_rails' in groups else external_url_sanitised }}"

gitaly_server_side_backups_url: "{{ ('s3://' + gitlab_object_storage_bucket_names['backups'] + '?region=' + aws_region) if cloud_provider == 'aws' else ('gs://' + gitlab_object_storage_bucket_names['backups']) if cloud_provider == 'gcp' else '' }}"
