---
- name: Configure externally managed PostgreSQL
  block:
    - name: Configure Database Preparation admin password secret
      kubernetes.core.k8s:
        state: present
        definition:
          kind: Secret
          type: Opaque
          metadata:
            name: "{{ database_label }}-admin-password"
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
          stringData:
            password: "{{ database_admin_password }}"
      no_log: true
      diff: false

    - name: Deploy psql pod
      kubernetes.core.k8s:
        kind: Pod
        name: "{{ database_label }}"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        state: present
        definition:
          spec:
            containers:
              - name: psql
                image: "{{ psql_image }}"
                command: ["/bin/sh"]
                args: ["-c", "while true; do sleep 30; done"]
                env:
                  - name: PGUSER
                    value: "{{ database_admin_user }}"
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ database_label }}-admin-password"
                        key: password
                  - name: PGHOST
                    value: "{{ database_host }}"
                  - name: PGPORT
                    value: "{{ database_port | string }}"
                  - name: PGDATABASE
                    value: "template1"
                  - name: GL_PGUSER
                    value: "{{ database_user }}"
                  - name: GL_PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ database_password_secret }}"
                        key: password
            nodeSelector: "{{ {'workload': gitlab_charts_supporting_node_selector} if gitlab_charts_node_selector_enable else omit }}"
      no_log: true
      diff: true

    - name: Check psql pod is ready
      command: "kubectl wait --for=condition=ready --timeout=360s pod/{{ database_label }} -n {{ gitlab_cloud_native_release_namespace }}"

    - name: Create Database User for {{ database_label }}
      kubernetes.core.k8s_exec:
        pod: "{{ database_label }}"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        command: |
          sh -c "psql -c \"CREATE USER $GL_PGUSER WITH PASSWORD '$GL_PGPASSWORD' CREATEDB;\""
      register: database_user_create_result
      failed_when:
        - database_user_create_result.rc != 0
        - ("already exists" not in database_user_create_result.stderr)

    - name: Create Database for {{ database_label }}
      kubernetes.core.k8s_exec:
        pod: "{{ database_label }}"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        command: |
          sh -c 'PGUSER=$GL_PGUSER PGPASSWORD=$GL_PGPASSWORD psql -c "CREATE DATABASE {{ database_name }};"'
      register: database_create_result
      failed_when:
        - database_create_result.rc != 0
        - ("already exists" not in database_create_result.stderr)

    - name: Enable required PostgreSQL extensions
      kubernetes.core.k8s_exec:
        pod: "{{ database_label }}"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        command: |
          psql -d {{ database_name }} -c "CREATE EXTENSION IF NOT EXISTS {{ item }};"
      loop: "{{ database_extensions }}"
      loop_control:
        loop_var: item
      when: database_extensions is defined
  always:
    - name: Remove psql pod
      kubernetes.core.k8s:
        kind: Pod
        name: "{{ database_label }}"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        state: absent
      no_log: true
      diff: true

    - name: Remove Database Preparation admin password secret
      kubernetes.core.k8s:
        kind: Secret
        name: "{{ database_label }}-admin-password"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        state: absent
      no_log: true
      diff: false
