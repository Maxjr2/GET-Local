---
- name: Configure kubeconfig credentials
  import_tasks: kubeconfig.yml
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - kubeconfig

- name: Setup Monitoring Namespaces if configured
  kubernetes.core.k8s:
    name: "{{ item }}"
    kind: Namespace
    state: present
  loop:
    - "{{ kube_prometheus_stack_charts_namespace }}"
    - "{{ consul_charts_namespace }}"
  when: cloud_native_hybrid_monitoring_setup
  tags:
    - reconfigure
    - charts
    - kube-prometheus-stack

- name: Configure chart secrets
  import_tasks: secrets.yml
  tags:
    - reconfigure
    - charts
    - secrets

- name: Run custom secrets chart tasks
  block:
    - name: Check if Custom Secrets Chart tasks file exists
      stat:
        path: "{{ gitlab_charts_secrets_tasks_file }}"
      register: gitlab_charts_secrets_tasks_file_path

    - name: Run Custom Secrets Chart tasks
      include_tasks: "{{ gitlab_charts_secrets_tasks_file }}"
      when: gitlab_charts_secrets_tasks_file_path.stat.exists
  tags:
    - reconfigure
    - charts
    - secrets

- name: Run any Cloud Provider prep tasks
  block:
    - name: Run AWS EKS prep tasks
      import_tasks: cloud_provider_prep/aws_eks.yml
      when: cloud_provider == 'aws'

    - name: Run GCP GKE prep tasks
      import_tasks: cloud_provider_prep/gcp_gke.yml
      when: cloud_provider == 'gcp'
  tags:
    - reconfigure
    - charts
    - cloud_provider_prep

- name: Run any database prep tasks
  import_tasks: database_prep.yml
  tags:
    - reconfigure
    - charts
    - secrets
    - database_prep

- name: Calculate Webservice / Sidekiq pod replica counts as required
  block:
    - name: Calculate Webservice / Sidekiq max replica counts based on Linux Package (Omnibus) Gitaly deployment size if not configured
      block:
        - name: Get Gitaly CPU count
          set_fact:
            gitaly_cpus: "{{ groups['gitaly'] | sort | map('extract', hostvars, ['ansible_processor_vcpus']) | list | sum }}"

        - name: Set calculated Webservice / Sidekiq max replica counts
          set_fact:
            # Calculate maximum pod count by matching Gitaly CPU count to RA sizes or best effort if no matches
            calculated_webservice_max_replicas: "{{ webservice_default_replica_counts[gitaly_cpus] | default((gitaly_cpus | int / 2.4) | round | int, 'true') }}"
            calculated_sidekiq_max_replicas: "{{ sidekiq_default_replica_counts[gitaly_cpus] | default(14 if gitaly_cpus | int >= 48 else (8 if gitaly_cpus | int >= 12 else 2), 'true') }}"
      when:
        - "'gitaly' in groups"
        - (gitlab_charts_webservice_max_replicas == '' or gitlab_charts_sidekiq_max_replicas == '')

    - name: Throw error if Webservice / Sidekiq max pod replica counts have not be configured and can't be calculated
      fail:
        msg: |
          Webservice or Sidekiq max pod replica counts have not be configured and can't be calculated
          Ensure 'gitlab_charts_webservice_max_replicas' and 'gitlab_charts_sidekiq_max_replicas' have been set and re-run
      when:
        - "'gitaly' not in groups"
        - (gitlab_charts_webservice_max_replicas == '' or gitlab_charts_sidekiq_max_replicas == '')

    - name: Set Webservice / Sidekiq max replica counts if configured
      set_fact:
        webservice_max_replicas: "{{ gitlab_charts_webservice_max_replicas if gitlab_charts_webservice_max_replicas != '' else calculated_webservice_max_replicas }}"
        sidekiq_max_replicas: "{{ gitlab_charts_sidekiq_max_replicas if gitlab_charts_sidekiq_max_replicas != '' else calculated_sidekiq_max_replicas }}"

    - name: Set Webservice / Sidekiq min replica counts
      set_fact:
        webservice_min_replicas: "{{ gitlab_charts_webservice_min_replicas if gitlab_charts_webservice_min_replicas != '' else (webservice_max_replicas | int * gitlab_charts_webservice_min_replicas_scaler) | round | int }}"
        sidekiq_min_replicas: "{{ gitlab_charts_sidekiq_min_replicas if gitlab_charts_sidekiq_min_replicas != '' else (sidekiq_max_replicas | int * gitlab_charts_sidekiq_min_replicas_scaler) | round | int }}"

    - name: Set Webservice / Sidekiq max unavailable counts
      set_fact:
        webservice_max_unavailable: "{{ gitlab_charts_webservice_max_unavailable if gitlab_charts_webservice_max_unavailable != '' else [(webservice_max_replicas | int * gitlab_charts_webservice_max_unavailable_scaler) | round | int, 1] | max }}"
        sidekiq_max_unavailable: "{{ gitlab_charts_sidekiq_max_unavailable if gitlab_charts_sidekiq_max_unavailable != '' else [(sidekiq_max_replicas | int * gitlab_charts_sidekiq_max_unavailable_scaler) | round | int, 1] | max }}"
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack

- name: Add GitLab Charts repo
  kubernetes.core.helm_repository:
    name: "{{ gitlab_charts_repo_name }}"
    repo_url: "{{ gitlab_charts_repo_url }}"
  tags:
    - reconfigure
    - charts

- name: Update GitLab Charts repo
  command: "helm repo update {{ gitlab_charts_repo_name }}"
  tags:
    - reconfigure
    - charts

- name: Get GitLab Charts version if App version specified
  # Helm doesn't allow installs by app_version - https://github.com/helm/helm/issues/8194
  block:
    - name: Get all GitLab Charts versions
      command: helm search repo gitlab/gitlab -l -o json
      register: gitlab_charts_versions

    - name: Match GitLab Charts version to App version
      set_fact:
        gitlab_charts_version: "{{ (gitlab_charts_versions.stdout | from_json | selectattr('name', 'equalto', 'gitlab/gitlab') | selectattr('app_version', 'match', '^v?' + gitlab_version + '$'))[0].version | default('', true) }}"

    - name: Fail if GitLab Charts version can't be found
      fail:
        msg: "Charts version for {{ gitlab_version }} could not be found. Exiting..."
      when: gitlab_charts_version == ''

    - name: Show GitLab Charts Version
      debug:
        msg: "Charts version for {{ gitlab_version }} is {{ gitlab_charts_version }}"
  when: gitlab_version != ""
  tags:
    - reconfigure
    - charts
    - charts_version

- name: Lookup GitLab Chart values
  set_fact:
    gitlab_charts_values: "{{ lookup('template', 'templates/gitlab.yml.j2') | from_yaml }}"
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack

- name: Check if custom GitLab Chart values are provided
  stat:
    path: "{{ gitlab_charts_custom_config_file }}"
  register: custom_config_file
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack

- name: Merge in custom GitLab Chart values if provided
  set_fact:
    gitlab_charts_values: "{{ gitlab_charts_values | combine(lookup('template', gitlab_charts_custom_config_file) | from_yaml, recursive=True) }}"
  when: custom_config_file.stat.exists
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack

- name: Show charts values if configured
  debug:
    msg: "{{ gitlab_charts_values }}"
  when: gitlab_charts_show_values
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack

- name: Verify GitLab Charts
  kubernetes.core.helm_pull:
    chart_ref: "{{ gitlab_charts_repo_name }}/gitlab"
    chart_version: "{{ gitlab_charts_version | default(None) }}"
    destination: /tmp
    verify_chart: true
    verify_chart_keyring: "{{ gitlab_charts_gpg_key_file_path }}"
  register: helm_verify_result
  failed_when:
    - (helm_verify_result.msg is defined and 'sha256 sum does not match' in helm_verify_result.msg)  or
      ('FAILED' in helm_verify_result.stderr)
  when: gitlab_charts_gpg_key_file_path is defined
  tags:
    - reconfigure
    - charts

- name: Install GitLab Charts
  kubernetes.core.helm:
    name: gitlab
    chart_ref: "{{ gitlab_charts_repo_name }}/gitlab"
    chart_version: "{{ gitlab_charts_version | default(None) }}"
    release_namespace: "{{ gitlab_charts_release_namespace }}"
    values: "{{ gitlab_charts_values }}"
  register: helm_install_result
  failed_when:
    - (helm_install_result.msg is defined and 'Failure when executing Helm command' in helm_install_result.msg) or
      ('FAILED' in helm_install_result.stderr)
  tags:
    - reconfigure
    - charts

- name: Setup Monitoring Charts if configured
  import_tasks: 'monitoring.yml'
  when: cloud_native_hybrid_monitoring_setup
  tags:
    - reconfigure
    - charts
    - kube-prometheus-stack

- name: Run Custom Tasks
  block:
    - name: Check if Custom Tasks file exists
      stat:
        path: "{{ gitlab_charts_custom_tasks_file }}"
      register: gitlab_charts_custom_tasks_file_path
      delegate_to: localhost
      become: false

    - name: Run Custom Tasks
      include_tasks:
        file: "{{ gitlab_charts_custom_tasks_file }}"
        apply:
          tags: custom_tasks
      when: gitlab_charts_custom_tasks_file_path.stat.exists
  tags: custom_tasks
