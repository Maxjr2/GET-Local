---
- name: Configure kubeconfig credentials
  import_tasks: kubeconfig.yml
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - kubeconfig
    - zero-downtime-post-deployment-migrations

- name: Create GitLab Cloud Native namespace
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ gitlab_cloud_native_release_namespace }}"

- name: Setup Monitoring Namespaces if configured
  block:
    - name: Setup kube-prometheus-stack namespace
      kubernetes.core.k8s:
        name: "{{ kube_prometheus_stack_charts_namespace }}"
        kind: Namespace
        state: present

    - name: Setup Consul namespace
      kubernetes.core.k8s:
        name: "{{ consul_charts_namespace }}"
        kind: Namespace
        state: present
      when: "'consul' in groups"
  when: cloud_native_hybrid_monitoring_setup
  tags:
    - reconfigure
    - charts
    - kube-prometheus-stack

- name: Configure chart secrets
  import_tasks: secrets.yml
  tags:
    - reconfigure
    - charts
    - secrets

- name: Run custom secrets chart tasks
  block:
    - name: Check if Custom Secrets Chart tasks file exists
      stat:
        path: "{{ gitlab_charts_secrets_tasks_file }}"
      register: gitlab_charts_secrets_tasks_file_path

    - name: Run Custom Secrets Chart tasks
      include_tasks: "{{ gitlab_charts_secrets_tasks_file }}"
      when: gitlab_charts_secrets_tasks_file_path.stat.exists
  tags:
    - reconfigure
    - charts
    - secrets

- name: Run any Cloud Provider prep tasks
  block:
    - name: Run AWS EKS prep tasks
      import_tasks: cloud_provider_prep/aws_eks.yml
      when: cloud_provider == 'aws'

    - name: Run GCP GKE prep tasks
      import_tasks: cloud_provider_prep/gcp_gke.yml
      when: cloud_provider == 'gcp'
  tags:
    - reconfigure
    - charts
    - cloud_provider_prep

- name: Gather facts for Omnibus PostgreSQL cluster
  # Only needed for HA Omnibus postgres (>1 node, non-external). The Helm chart must target the current
  # leader node for DB migrations, so we resolve it here before building chart values.
  block:
    - name: Get latest PostgreSQL leader for running Migrations
      command: gitlab-ctl get-postgresql-primary
      register: postgres_leader_int_address
      delegate_to: "{{ groups['postgres'][0] | default(omit) }}"
      delegate_facts: true
      become: true

    - name: Set PostgreSQL leader IP and Port
      set_fact:
        postgres_migrations_host: "{{ postgres_leader_int_address.stdout.split(':')[0] }}"
        postgres_migrations_port: "{{ postgres_leader_int_address.stdout.split(':')[1] }}"
  when:
    - "'postgres' in groups and groups['postgres'] | length > 1"
    - not postgres_external
  tags:
    - reconfigure
    - charts
    - charts_values

- name: Run external PostgreSQL database prep
  import_tasks: external_database_prep.yml
  vars:
    database_label: gitlab-psql
    database_host: "{{ postgres_host }}"
    database_port: "{{ postgres_port }}"
    database_admin_user: "{{ postgres_admin_username }}"
    database_admin_password: "{{ postgres_admin_password }}"
    database_user: "{{ postgres_username.split('@')[0] }}"
    database_password_secret: gitlab-postgres-password
    database_name: "{{ postgres_database_name }}"
    database_extensions: ["amcheck", "pg_trgm", "btree_gist", "plpgsql", "pg_stat_statements"]
  tags:
    - reconfigure
    - db_migrate
    - postgres_external_prep
  when:
    - postgres_external
    - postgres_external_prep
    - cloud_native_hybrid_geo_role != 'secondary'  # Secondary's DB is a replica of the primary's; not provisioned independently

- name: Run external Container Registry database prep
  import_tasks: external_database_prep.yml
  vars:
    database_label: gitlab-container-registry-psql
    database_host: "{{ container_registry_database_host }}"
    database_port: "{{ container_registry_database_port }}"
    database_admin_user: "{{ container_registry_database_admin_username }}"
    database_admin_password: "{{ container_registry_database_admin_password }}"
    database_user: "{{ container_registry_database_username }}"
    database_password_secret: gitlab-container-registry-db-password
    database_name: "{{ container_registry_database_name }}"
  tags: container_registry
  when:
    - container_registry_enable
    - container_registry_database_configure
    - container_registry_database_external

- name: Run external OpenBao database prep
  import_tasks: external_database_prep.yml
  vars:
    database_label: gitlab-openbao-psql
    database_host: "{{ openbao_database_host }}"
    database_port: "{{ openbao_database_port }}"
    database_admin_user: "{{ openbao_database_admin_username }}"
    database_admin_password: "{{ openbao_database_admin_password }}"
    database_user: "{{ openbao_database_username }}"
    database_password_secret: gitlab-openbao-db-password
    database_name: "{{ openbao_database_name }}"
  tags: openbao
  when:
    - openbao_enable
    - postgres_external
    - postgres_external_prep
    - cloud_native_hybrid_geo_role != 'secondary'  # Same as above: secondary inherits from primary

- name: Fail if Gitaly on Kubernetes resource sizing has not been configured
  fail:
    msg: |
      Gitaly on Kubernetes is enabled but resource sizing has not been configured.
      Ensure 'gitlab_charts_gitaly_requests_memory_gb' and 'gitlab_charts_gitaly_requests_cpu' have been set and re-run.
      See https://docs.gitlab.com/administration/gitaly/kubernetes/ for guidance.
  when:
    - gitlab_charts_gitaly_setup
    - gitlab_charts_gitaly_requests_memory_gb == '' or gitlab_charts_gitaly_requests_cpu == ''
  tags:
    - reconfigure
    - charts
    - charts_values

- name: Calculate Webservice / Sidekiq pod replica counts as required
  block:
    - name: Calculate Webservice / Sidekiq max replica counts based on Linux Package (Omnibus) Gitaly deployment size if not configured
      block:
        - name: Get Gitaly CPU count
          set_fact:
            gitaly_cpus: "{{ groups['gitaly'] | sort | map('extract', hostvars, ['ansible_facts', 'processor_vcpus']) | list | sum }}"

        - name: Set calculated Webservice / Sidekiq max replica counts
          set_fact:
            # Webservice: looks up Gitaly vCPU total in webservice_default_replica_counts (defaults/main.yml);
            # falls back to gitaly_cpus / 2.4 if no RA size match. Sidekiq: >=48 vCPUs → 14, >=12 → 8, else 2.
            calculated_webservice_max_replicas: "{{ webservice_default_replica_counts[gitaly_cpus] | default((gitaly_cpus | int / 2.4) | round | int, true) }}"
            calculated_sidekiq_max_replicas: "{{ sidekiq_default_replica_counts[gitaly_cpus] | default(14 if gitaly_cpus | int >= 48 else (8 if gitaly_cpus | int >= 12 else 2), true) }}"
      when:
        - "'gitaly' in groups"
        - (gitlab_charts_webservice_max_replicas == '' or gitlab_charts_sidekiq_max_replicas == '')

    - name: Throw error if Webservice / Sidekiq max pod replica counts have not be configured and can't be calculated
      fail:
        msg: |
          Webservice or Sidekiq max pod replica counts have not be configured and can't be calculated
          Ensure 'gitlab_charts_webservice_max_replicas' and 'gitlab_charts_sidekiq_max_replicas' have been set and re-run
      when:
        - "'gitaly' not in groups"
        - (gitlab_charts_webservice_max_replicas == '' or gitlab_charts_sidekiq_max_replicas == '')

    - name: Set Webservice / Sidekiq max replica counts if configured
      set_fact:
        webservice_max_replicas: "{{ gitlab_charts_webservice_max_replicas if gitlab_charts_webservice_max_replicas != '' else calculated_webservice_max_replicas }}"
        sidekiq_max_replicas: "{{ gitlab_charts_sidekiq_max_replicas if gitlab_charts_sidekiq_max_replicas != '' else calculated_sidekiq_max_replicas }}"

    - name: Set Webservice / Sidekiq min replica counts
      # min_replicas = max_replicas * scaler (default scalers defined in defaults/main.yml)
      set_fact:
        webservice_min_replicas: "{{ gitlab_charts_webservice_min_replicas if gitlab_charts_webservice_min_replicas != '' else (webservice_max_replicas | int * gitlab_charts_webservice_min_replicas_scaler) | round | int }}"
        sidekiq_min_replicas: "{{ gitlab_charts_sidekiq_min_replicas if gitlab_charts_sidekiq_min_replicas != '' else (sidekiq_max_replicas | int * gitlab_charts_sidekiq_min_replicas_scaler) | round | int }}"

    - name: Set Webservice / Sidekiq max unavailable counts
      # max_unavailable = max(max_replicas * scaler, 1) — floored at 1 to always allow rolling updates
      set_fact:
        webservice_max_unavailable: "{{ gitlab_charts_webservice_max_unavailable if gitlab_charts_webservice_max_unavailable != '' else [(webservice_max_replicas | int * gitlab_charts_webservice_max_unavailable_scaler) | round | int, 1] | max }}"
        sidekiq_max_unavailable: "{{ gitlab_charts_sidekiq_max_unavailable if gitlab_charts_sidekiq_max_unavailable != '' else [(sidekiq_max_replicas | int * gitlab_charts_sidekiq_max_unavailable_scaler) | round | int, 1] | max }}"
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - zero-downtime-post-deployment-migrations

- name: Add GitLab Helm repo
  kubernetes.core.helm_repository:
    name: "{{ gitlab_charts_repo_name }}"
    repo_url: "{{ gitlab_charts_repo_url }}"
  when: not gitlab_charts_direct_install
  tags:
    - reconfigure
    - charts

- name: Update GitLab Helm repo
  command: "helm repo update {{ gitlab_charts_repo_name }}"
  when: not gitlab_charts_direct_install
  tags:
    - reconfigure
    - charts

- name: Get GitLab Charts version if App version specified
  # Helm can't install by app_version (https://github.com/helm/helm/issues/8194), so we fetch all chart
  # versions and select the one matching gitlab_version.
  block:
    - name: Get all GitLab Charts versions
      command: "helm search repo {{ gitlab_charts_ref }} -l -o json"
      register: gitlab_charts_versions

    - name: Match GitLab Charts version to App version
      set_fact:
        gitlab_charts_version: "{{ (gitlab_charts_versions.stdout | from_json | selectattr('name', 'equalto', gitlab_charts_ref) | selectattr('app_version', 'match', '^v?' + gitlab_version + '$'))[0].version | default('', true) }}"

    - name: Fail if GitLab Charts version can't be found
      fail:
        msg: "Charts version for {{ gitlab_version }} could not be found. Exiting..."
      when: gitlab_charts_version == ''

    - name: Show GitLab Charts Version
      debug:
        msg: "Charts version for {{ gitlab_version }} is {{ gitlab_charts_version }}"
  when:
    - gitlab_version != ""
    - not gitlab_charts_direct_install
  tags:
    - reconfigure
    - charts
    - charts_version
    - zero-downtime-post-deployment-migrations

- name: Determine ingress type
  set_fact:
    envoy_gateway_setup: >-
      {{ not gitlab_charts_nginx_ingress_enable and
         gitlab_charts_envoy_gateway_enable and
         (gitlab_version == '' or gitlab_version is version('19.0', '>=')) }}
    # True when nginx ingress should be configured with either explicitly enabled or pre-19.0 versions
    nginx_ingress_setup: >-
      {{ gitlab_charts_nginx_ingress_enable or
         (gitlab_charts_envoy_gateway_enable and
          gitlab_version != '' and gitlab_version is version('19.0', '<')) }}
  tags:
    - reconfigure
    - charts

- name: Prepare Gateway API and Envoy Gateway CRDs
  block:
  - name: Get latest GitLab chart details
    command: helm search repo "{{ gitlab_charts_repo_name }}/gitlab" -o json
    register: latest_gitlab_chart_version
    when: not offline_setup

  - name: Fetch GitLab Chart.yaml
    ansible.builtin.uri:
      url: "https://gitlab.com/gitlab-org/charts/gitlab/-/raw/v{{ gitlab_charts_version | default((latest_gitlab_chart_version.stdout | from_json)[0].version) }}/Chart.yaml"
      return_content: yes
    register: gitlab_chart_yaml
    when: not offline_setup

  - name: Extract Envoy Gateway version
    set_fact:
      envoy_gateway_version: "{{ (gitlab_chart_yaml.content | from_yaml).dependencies | selectattr('alias', 'defined') | selectattr('alias', 'equalto', 'envoy-gateway') | map(attribute='version') | first }}"
    when: not offline_setup

  - name: Template Gateway API and Envoy Gateway CRDs
    kubernetes.core.helm_template:
      chart_ref: "{{ gitlab_charts_envoy_gateway_crd_repo_ref }}"
      chart_version: "{{ envoy_gateway_version | default(omit) }}"
      release_name: eg-crds
      values:
        crds:
          gatewayAPI:
            enabled: true
          envoyGateway:
            enabled: true
    register: envoy_crds
    no_log: true

  - name: Apply Gateway API and Envoy Gateway CRDs
    kubernetes.core.k8s:
      state: present
      definition: "{{ envoy_crds.stdout | from_yaml_all }}"
      namespace: "{{ gitlab_cloud_native_release_namespace }}"
      server_side_apply:
        field_manager: ansible_GET
    no_log: true
  tags:
    - reconfigure
    - charts
    - gateway_api
    - crds
  when:
    - envoy_gateway_setup

- name: Lookup GitLab Chart values
  set_fact:
    gitlab_charts_values: "{{ lookup('template', 'templates/gitlab.yml.j2') | from_yaml }}"
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - zero-downtime-post-deployment-migrations

- name: Check if custom GitLab Chart values are provided
  stat:
    path: "{{ gitlab_charts_custom_config_file }}"
  register: custom_config_file
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - zero-downtime-post-deployment-migrations

- name: Merge in custom GitLab Chart values if provided
  set_fact:
    gitlab_charts_values: "{{ gitlab_charts_values | combine(lookup('template', gitlab_charts_custom_config_file) | from_yaml, recursive=True) }}"
  when: custom_config_file.stat.exists
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - zero-downtime-post-deployment-migrations

- name: Merge in Zero downtime values if enabled
  set_fact:
    gitlab_charts_values: "{{ gitlab_charts_values | combine(lookup('template', 'templates/zero_downtime.yml.j2') | from_yaml, recursive=True) }}"
  when: gitlab_charts_zero_downtime_update
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - zero-downtime-post-deployment-migrations

- name: Show charts values if configured
  debug:
    msg: "{{ gitlab_charts_values }}"
  when: gitlab_charts_show_values
  tags:
    - reconfigure
    - charts
    - charts_values
    - kube-prometheus-stack
    - zero-downtime-post-deployment-migrations

- name: Install GitLab Charts
  # Mutually exclusive with Install GitLab Operator below — only one install path runs per execution.
  import_tasks: 'gitlab_charts.yml'
  when: not gitlab_operator
  tags:
    - reconfigure
    - charts

- name: Install GitLab Operator
  import_tasks: 'gitlab_operator.yml'
  when: gitlab_operator
  tags:
    - reconfigure
    - operator

- name: Setup Monitoring Charts if configured
  import_tasks: "monitoring.yml"
  when: cloud_native_hybrid_monitoring_setup
  tags:
    - reconfigure
    - charts
    - kube-prometheus-stack

- name: Run Custom Tasks
  block:
    - name: Check if Custom Tasks file exists
      stat:
        path: "{{ gitlab_charts_custom_tasks_file }}"
      register: gitlab_charts_custom_tasks_file_path
      delegate_to: localhost
      become: false

    - name: Run Custom Tasks
      include_tasks:
        file: "{{ gitlab_charts_custom_tasks_file }}"
        apply:
          tags: custom_tasks
      when: gitlab_charts_custom_tasks_file_path.stat.exists
  tags: custom_tasks
