---
- name: Configure kubeconfig credentials
  import_tasks: kubeconfig.yml

- name: Uninstall GitLab Charts
  kubernetes.core.helm:
    release_name: gitlab
    release_namespace: "{{ gitlab_cloud_native_release_namespace }}"
    state: absent
    wait: true
  when: not gitlab_operator

- name: Uninstall Prometheus Stack
  kubernetes.core.helm:
    release_name: gitlab-kube-prometheus-stack
    release_namespace: "{{ kube_prometheus_stack_charts_namespace }}"
    state: absent
    wait: true
  when: cloud_native_hybrid_monitoring_setup

- name: Uninstall GitLab Operator
  block:
    - name: Uninstall an instance of GitLab
      k8s:
        state: absent
        definition:
          apiVersion: apps.gitlab.com/v1beta1
          kind: GitLab
          metadata:
            name: gitlab
            namespace: "{{ gitlab_cloud_native_release_namespace }}"

    - name: Uninstall GitLab Operator
      kubernetes.core.helm:
        release_name: gitlab-operator
        release_namespace: "{{ gitlab_cloud_native_release_namespace }}"
        state: absent
        wait: true
  when: gitlab_operator
