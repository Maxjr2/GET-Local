- name: Kubeconfig - Configure local kubeconfig to point to correct cluster
  vars:
    kubeconfig_setup: true
    prefix: "{{ geo_site_prefix }}"
    gcp_project: "{{ geo_site_gcp_project }}"
    gcp_gke_location: "{{ geo_site_gcp_gke_location }}"
    aws_region: "{{ geo_site_aws_region }}"
  include_role:
    name: gitlab_charts
    tasks_from: kubeconfig
    apply:
      become: false
      delegate_to: localhost
      run_once: true

- name: Kubeconfig - Fetch task runner pod
  kubernetes.core.k8s_info:
    kind: Pod
    label_selectors:
      - app=toolbox
    field_selectors:
      - status.phase=Running
    namespace: "{{ gitlab_cloud_native_release_namespace }}"
  register: toolbox_info
  until: toolbox_info.resources | length > 0
  retries: 30
  delay: 10

- name: Kubeconfig - Save Task Runner pod name
  set_fact:
    toolbox_pod: "{{ toolbox_info | json_query('resources[0].metadata.name') }}"
