- name: Maintenance Mode - Set Maintenance Mode for Omnibus environments
  block:
    - name: Maintenance Mode - Set Maintenance Mode to {{ maintenance_mode_state }} on GitLab Rails Primary node
      command: |
        gitlab-rails runner "::Gitlab::CurrentSettings.update!(maintenance_mode: {{ maintenance_mode_state | lower }}, maintenance_mode_message: \"{{ maintenance_mode_message }}\")"
      register: primary_result
      ignore_errors: true
      when: ('gitlab_rails_primary' in group_names)

    - name: Maintenance Mode - Set Maintenance Mode to {{ maintenance_mode_state }} on GitLab Rails Secondary nodes
      command: |
        gitlab-rails runner "::Gitlab::CurrentSettings.update!(maintenance_mode: {{ maintenance_mode_state | lower }}, maintenance_mode_message: \"{{ maintenance_mode_message }}\")"
      with_inventory_hostnames:
        - "{{ site_group_name }}_gitlab_rails_secondary"
      delegate_to: "{{ node | default(omit) }}"
      register: secondary_result
      loop_control:
        loop_var: node
      until: secondary_result.rc == 0
      ignore_errors: true
      run_once: true
      retries: 1
      when: hostvars[groups['gitlab_rails_primary'][0]]['primary_result']['rc'] != 0
  when:
    - not cloud_native_hybrid_geo
    - (site_group_name in group_names)

- name: Set Maintenance mode for Cloud Native Hybrid environments
  become: false
  delegate_to: localhost
  run_once: true
  block:
    - name: Maintenance Mode - Configure kubeconfig credentials for Geo primary site
      import_tasks: kubeconfig.yml

    - name: Maintenance Mode - Set Maintenance Mode for Cloud Native Hybrid environments
      block:
        - name: Maintenance Mode - Set Maintenance mode to {{ maintenance_mode_state }} for Cloud Native Hybrid environments
          ignore_errors: "{{ maintenance_mode_state | lower }}" # noqa ignore-errors
          kubernetes.core.k8s_exec:
            pod: "{{ toolbox_pod }}"
            namespace: "{{ geo_site_release_namespace if geo_site_release_namespace else gitlab_cloud_native_release_namespace }}"
            command: |
              gitlab-rails runner "::Gitlab::CurrentSettings.update!(maintenance_mode: {{ maintenance_mode_state | lower }}, maintenance_mode_message: \"{{ maintenance_mode_message }}\")"
      rescue:
        - name: Maintenance Mode - Wait for new toolbox pod to be available
          kubernetes.core.k8s_info:
            kind: Pod
            label_selectors:
              - app=toolbox
            field_selectors:
              - status.phase=Running
            namespace: "{{ geo_site_release_namespace if geo_site_release_namespace else gitlab_cloud_native_release_namespace }}"
          register: new_toolbox_pod
          until: new_toolbox_pod.resources | length > 0
          retries: 30 # 5 minute wait max
          delay: 10

        - name: Maintenance Mode - Retry with new toolbox pod
          kubernetes.core.k8s_exec:
            pod: "{{ new_toolbox_pod.resources[0].metadata.name }}"
            namespace: "{{ geo_site_release_namespace if geo_site_release_namespace else gitlab_cloud_native_release_namespace }}"
            command: |
              gitlab-rails runner "::Gitlab::CurrentSettings.update!(maintenance_mode: {{ maintenance_mode_state | lower }}, maintenance_mode_message: \"{{ maintenance_mode_message }}\")"
  when:
    - cloud_native_hybrid_geo
