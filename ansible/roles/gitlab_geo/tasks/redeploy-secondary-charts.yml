- name: Redeploy Secondary Cloud Native deployment - Configure kubeconfig credentials for Geo secondary site
  become: false
  delegate_to: localhost
  run_once: true
  import_tasks: kubeconfig.yml
  vars:
    geo_site_prefix: "{{ geo_secondary_site_prefix }}"
    geo_site_gcp_project: "{{ geo_secondary_site_gcp_project }}"
    geo_site_gcp_gke_location: "{{ geo_secondary_site_gcp_gke_location }}"
    geo_site_aws_region: "{{ geo_secondary_site_aws_region }}"

- name: Redeploy Secondary Charts - Prepare values
  block:
    - name: Redeploy Secondary Charts - Get GitLab Charts values for Cloud Native Hybrid environments
      become: false
      delegate_to: localhost
      run_once: true
      kubernetes.core.helm_info:
        name: gitlab
        release_namespace: "{{ gitlab_cloud_native_release_namespace }}"
      register: gitlab_info

    - name: Redeploy Secondary Charts - Set gitlab_values
      become: false
      delegate_to: localhost
      run_once: true
      set_fact:
        gitlab_values: "{{ item.value }}"
      loop: "{{ lookup('dict', gitlab_info.status) }}"
      when: "'values' in item.key"
  when: not gitlab_operator

- name: Redeploy Secondary Operator - Prepare Chart values
  block:
    - name: Redeploy Secondary Operator - Get GitLab CR installation values
      become: false
      delegate_to: localhost
      run_once: true
      kubernetes.core.k8s_info:
        kind: GitLab
        name: gitlab
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        api_version: apps.gitlab.com/v1beta1
      register: gitlab_cr_info

    - name: Redeploy Secondary Operator - Set gitlab_values
      become: false
      delegate_to: localhost
      run_once: true
      set_fact:
        # The 'values' key conflicts with the dict.values() method, so we need to extract it explicitly
        gitlab_values: "{{ gitlab_cr_info.resources[0].spec.chart | dict2items | selectattr('key', 'eq', 'values') | map(attribute='value') | first }}"
        gitlab_charts_version: "{{ gitlab_cr_info.resources[0].spec.chart.version }}"
  when: gitlab_operator

- name: Redeploy Secondary Cloud Native deployment - Update Geo Role from primary to secondary
  become: false
  delegate_to: localhost
  run_once: true
  set_fact:
    gitlab_values: "{{ gitlab_values | combine( {'global':{'geo':{'role': 'secondary' }}}, recursive=True ) }}"
  when: geo_recovery is defined and geo_recovery

- name: Redeploy Secondary Cloud Native deployment - Set Geo Tracking Postgres host during recovery
  become: false
  delegate_to: localhost
  run_once: true
  set_fact:
    gitlab_values: "{{ gitlab_values | combine( {'global':{'geo':{'psql':{'host': geo_tracking_postgres_host }}}}, recursive=True ) }}"
  when: geo_recovery is defined and geo_recovery

- name: Redeploy Secondary Cloud Native deployment - Update Registry primary API Url
  become: false
  delegate_to: localhost
  run_once: true
  set_fact:
    gitlab_values: "{{ gitlab_values | combine( {'global':{'geo':{'registry':{'replication':{'enabled': true, 'primaryApiUrl': geo_primary_registry_url }}}}}, recursive=True ) }}"
  when: container_registry_enable

- name: Show charts values if configured
  become: false
  delegate_to: localhost
  run_once: true
  debug:
    msg: "{{ gitlab_values }}"
  when: gitlab_charts_show_values

- name: Redeploy Secondary Cloud Native deployment - Add GitLab Charts repo
  become: false
  delegate_to: localhost
  run_once: true
  when: not gitlab_charts_direct_install
  kubernetes.core.helm_repository:
    name: "{{ gitlab_charts_repo_name }}"
    repo_url: "{{ gitlab_charts_repo_url }}"

- name: Redeploy Secondary Cloud Native deployment - Update GitLab Charts repo
  become: false
  delegate_to: localhost
  run_once: true
  command: "helm repo update {{ gitlab_charts_repo_name }}"

- name: Redeploy Secondary Charts - Prepare and install GitLab Chart
  block:
    - name: Get GitLab Charts version if App version specified
      block:
        - name: Redeploy Secondary Charts - Get all GitLab Charts versions
          command: "helm search repo {{ gitlab_charts_ref }} -l -o json"
          register: gitlab_charts_versions
          become: false
          delegate_to: localhost
          run_once: true

        - name: Redeploy Secondary Charts - Match GitLab Charts version to App version
          set_fact:
            gitlab_charts_version: "{{ (gitlab_charts_versions.stdout | from_json | selectattr('name', 'equalto', gitlab_charts_ref) | selectattr('app_version', 'match', '^v?' + gitlab_version + '$'))[0].version }}"
      when:
        - gitlab_charts_version is not defined
        - gitlab_version != ""
        - not gitlab_charts_direct_install

    - name: Redeploy Secondary Charts - Install GitLab Charts for Cloud Native Hybrid environments
      become: false
      delegate_to: localhost
      run_once: true
      kubernetes.core.helm:
        name: gitlab
        chart_ref: "{{ gitlab_charts_ref }}"
        chart_version: "{{ gitlab_charts_version | default(None) }}"
        release_namespace: "{{ gitlab_cloud_native_release_namespace }}"
        values: "{{ gitlab_values }}"
      register: helm_install_result
      failed_when:
        - (helm_install_result.msg is defined and 'Failure when executing Helm command' in helm_install_result.msg) or
          ('FAILED' in helm_install_result.stderr)
  when: not gitlab_operator

- name: Redeploy Secondary Operator - Prepare and install GitLab CR
  block:
    - name: Redeploy Secondary Operator - Update GitLab Operator repo
      become: false
      delegate_to: localhost
      run_once: true
      command: "helm repo update gitlab-operator"

    - name: Redeploy Secondary Operator - Deploy a GitLab instance via a GitLab custom resource (CR)
      become: false
      delegate_to: localhost
      run_once: true
      k8s:
        state: present
        definition:
          apiVersion: apps.gitlab.com/v1beta1
          kind: GitLab
          metadata:
            name: gitlab
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
          spec:
            chart:
              version: "{{ gitlab_charts_version }}"
              values: "{{ gitlab_values }}"

    # To allow for the resource to be Ready before proceeding
    - name: Redeploy Secondary Operator - Wait for GitLab resource to be Ready after install
      become: false
      delegate_to: localhost
      run_once: true
      block:
        - name: Wait for GitLab resource to be Ready
          kubernetes.core.k8s_info:
            api_version: apps.gitlab.com/v1beta1
            kind: GitLab
            name: gitlab
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
          register: gitlab_resource
          until:
            - gitlab_resource.resources is defined
            - gitlab_resource.resources | length > 0
            - gitlab_resource.resources[0].status is defined
            - gitlab_resource.resources[0].status.phase == 'Running'
          retries: 25
          delay: 30
      rescue:
        - name: Fail with custom message
          fail:
            msg: "GitLab resource did not become Ready within the expected time. Current status: {{ gitlab_resource.resources[0].status.phase | default('Unknown') }}"
  when: gitlab_operator

- name: Restart GitLab deployments to pick up latest secrets
  become: false
  delegate_to: localhost
  run_once: true
  command: "kubectl rollout restart deployment -n {{ gitlab_cloud_native_release_namespace }} -l release=gitlab -l app={{ item }}"
  loop:
    - webservice
    - sidekiq
    - gitlab-shell
    - toolbox

- name: Restart NGINX daemonset to pick up latest secrets
  become: false
  delegate_to: localhost
  run_once: true
  command: "kubectl rollout restart daemonset gitlab-nginx-ingress-controller -n {{ gitlab_cloud_native_release_namespace }}"

- name: Restart GitLab Registry deployment if present to pick up latest secrets
  become: false
  delegate_to: localhost
  run_once: true
  command: "kubectl rollout restart deployment/gitlab-registry -n {{ gitlab_cloud_native_release_namespace }}"
  when: container_registry_enable
