---
- name: Mount NFS if configured
  include_role:
    name: gitlab_nfs
    tasks_from: nfs_mount
  when:
    - "'gitlab_nfs' in groups"

- name: Propagate Secrets if existing
  include_role:
    name: common
    tasks_from: secrets
  when: gitlab_secrets_setup
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Copy over any Custom Files
  copy:
    src: "{{ item.src_path }}"
    dest: "{{ item.dest_path }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode if item.mode is defined else 'preserve' }}"
  loop: "{{ gitlab_rails_custom_files_paths }}"
  tags: reconfigure

- name: Copy over any configured SSL certificates
  import_tasks: ssl.yml
  tags: reconfigure

- name: Check if custom config exists
  stat:
    path: "{{ gitlab_rails_custom_config_file }}"
  delegate_to: localhost
  become: false
  tags: reconfigure
  register: gitlab_rails_custom_config_file_path

- name: Get Omnibus PostgreSQL leader
  block:
    - name: Get latest PostgreSQL leader
      command: gitlab-ctl get-postgresql-primary
      register: postgres_leader_int_address
      delegate_to: "{{ groups['postgres'][0] | default(omit) }}"
      delegate_facts: true
      become: true
      run_once: true

    - name: Update PostgreSQL leader IP and Port
      set_fact:
        postgres_host: "{{ postgres_leader_int_address.stdout.split(':')[0] }}"
        postgres_port: "{{ postgres_leader_int_address.stdout.split(':')[1] }}"
  when:
    - "'postgres' in groups and groups['postgres'] | length > 1"
    - not postgres_external
  tags:
    - reconfigure
    - db_migrate

- name: Configure database on externally managed PostgreSQL
  import_tasks: external_database_prep.yml
  vars:
    database_label: gitlab
    database_host: "{{ postgres_host }}"
    database_port: "{{ postgres_port }}"
    database_admin_user: "{{ postgres_admin_username }}"
    database_admin_password: "{{ postgres_admin_password }}"
    login_database_name: "{{ postgres_login_database }}"
    maintenance_database_name: "{{ postgres_maintenance_database }}"
    database_user: "{{ postgres_username }}"
    database_password: "{{ postgres_password }}"
    database_name: "{{ postgres_database_name }}"
    database_extensions: ['amcheck', 'pg_trgm', 'btree_gist', 'plpgsql', 'pg_stat_statements']
  tags:
    - reconfigure
    - db_migrate
    - postgres_external_prep
  when:
    - postgres_external
    - postgres_external_prep
    - "'gitlab_rails_primary' in group_names"
    - geo_secondary_site_group_name not in groups

- name: Configure Container Registry Database
  import_tasks: external_database_prep.yml
  vars:
    database_label: registry
    database_host: "{{ container_registry_database_host }}"
    database_port: "{{ container_registry_database_port }}"
    database_admin_user: "{{ container_registry_database_admin_username }}"
    database_admin_password: "{{ container_registry_database_admin_password }}"
    login_database_name: "{{ container_registry_login_database }}"
    maintenance_database_name: "{{ container_registry_login_database }}"
    database_user: "{{ container_registry_database_username }}"
    database_password: "{{ container_registry_database_password }}"
    database_name: "{{ container_registry_database_name }}"
  tags: container_registry
  when:
    - container_registry_enable
    - container_registry_database_configure
    - container_registry_database_external

- name: Run Database Migrations
  block:
    - name: Setup GitLab deploy node config file with DB Migrations
      template:
        src: templates/gitlab-rails.gitlab.rb.j2
        dest: /etc/gitlab/gitlab.rb
      vars:
        db_migrate: true
      tags:
        - reconfigure
        - db_migrate

    - name: Setup Custom Config
      template:
        src: "{{ gitlab_rails_custom_config_file }}"
        dest: "/etc/gitlab/gitlab.gitlab_rails.custom.rb"
        mode: '0600'
      tags:
        - reconfigure
        - db_migrate
      when: gitlab_rails_custom_config_file_path.stat.exists

    - name: Reconfigure GitLab deploy node
      command: gitlab-ctl reconfigure
      register: result
      retries: 3
      until: result is success
      tags:
        - reconfigure
        - db_migrate
  when: "'gitlab_rails_primary' in group_names"

- name: Setup all GitLab Rails config files
  template:
    src: templates/gitlab-rails.gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
  register: result
  retries: 3
  until: result is success
  tags: reconfigure

- name: Setup Custom Config
  template:
    src: "{{ gitlab_rails_custom_config_file }}"
    dest: "/etc/gitlab/gitlab.gitlab_rails.custom.rb"
    mode: '0600'
  when: gitlab_rails_custom_config_file_path.stat.exists
  tags: reconfigure

- name: Remove old Custom Config if not configured
  file:
    path: "/etc/gitlab/gitlab.gitlab_rails.custom.rb"
    state: absent
  when: not gitlab_rails_custom_config_file_path.stat.exists
  tags: reconfigure

- name: Reconfigure all GitLab Rails
  command: gitlab-ctl reconfigure
  register: result
  retries: 3
  until: result is success
  tags: reconfigure

- name: Propagate Secrets if new or changed
  include_role:
    name: common
    tasks_from: secrets
  vars:
    gitlab_secrets_post_reconfigure: true
  when: gitlab_secrets_setup
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Propagate SSH Keys
  block:
    - name: Set up temp folder on local
      tempfile:
        state: directory
        prefix: "gitlab-environment-toolkit-"
      register: ssh_temp_folder
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Find all SSH host keys on primary Rails node
      ansible.builtin.find:
        paths: "{{ gitlab_shell_ssh_key_path }}/"
        patterns: 'ssh_host_*'
      register: ssh_host_keys
      when: "'gitlab_rails_primary' in group_names"

    - name: Fetch all SSH host keys from primary Rails node to local
      fetch:
        src: "{{ item.path }}"
        dest: "{{ ssh_temp_folder.path }}/"
        flat: true
      with_items: "{{ ssh_host_keys.files }}"
      no_log: true
      when: "'gitlab_rails_primary' in group_names"
      changed_when: false

    - name: Copy all SSH host keys to secondary Rails nodes
      copy:
        src: "{{ item }}"
        dest: "{{ gitlab_shell_ssh_key_path }}"
      with_fileglob: "{{ ssh_temp_folder.path }}/ssh_host_*"
      no_log: true
      when: "'gitlab_rails_secondary' in group_names"

    - name: Remove temp folder
      file:
        path: "{{ ssh_temp_folder.path }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
  when:
    - groups['gitlab_rails'] | length > 1
    - gitlab_shell_ssh_sync_keys
  tags:
    - reconfigure
    - secrets
    - ssh_keys

- name: Configure SSH
  block:
    - name: Configure SSH Fast Lookup if OpenSSH service being used
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          Match User git   # Apply the AuthorizedKeysCommands to the git user only
            AuthorizedKeysCommand /opt/gitlab/embedded/service/gitlab-shell/bin/gitlab-shell-authorized-keys-check git %u %k
            AuthorizedKeysCommandUser git
          Match all        # End match, settings apply to all users again
        state: "{{ 'present' if gitlab_shell_ssh_daemon == 'openssh' else 'absent' }}"
      register: sshd_config_result

    - name: Reload OpenSSH service if being used
      service:
        name: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
        state: reloaded
      when:
        - gitlab_shell_ssh_daemon == 'openssh'
        - sshd_config_result.changed
  tags:
    - reconfigure
    - secrets
    - ssh_keys

- name: Restart GitLab
  command: gitlab-ctl restart
  register: result
  retries: 2
  until: result is success
  tags:
    - reconfigure
    - restart

- name: Run Custom Tasks
  block:
    - name: Check if Custom Tasks file exists
      stat:
        path: "{{ gitlab_rails_custom_tasks_file }}"
      register: gitlab_rails_custom_tasks_file_path
      delegate_to: localhost
      become: false

    - name: Run Custom Tasks
      include_tasks:
        file: "{{ gitlab_rails_custom_tasks_file }}"
        apply:
          tags: custom_tasks
      when: gitlab_rails_custom_tasks_file_path.stat.exists
  tags: custom_tasks
