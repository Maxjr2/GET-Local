---
- name: Copy External SSL certificates (Single Node)
  block:
    - name: Fail if External SSL certificate is not provided (Single Node)
      fail:
        msg: "External SSL certificate not provided. Ensure 'external_ssl_files_host_certificate' has been configured or there is a valid file available at location defined by 'external_ssl_files_host_certificate_file' and run again. Exiting..."
      when: external_ssl_files_host_certificate | length == 0

    - name: Fail if External SSL key is not provided (Single Node)
      fail:
        msg: "External SSL key not provided. Ensure 'external_ssl_files_host_key' has been configured or there is a valid file available at location defined by 'external_ssl_files_host_key_file' and run again. Exiting..."
      when: external_ssl_files_host_key | length == 0

    - name: Copy over User provided SSL files (Single Node)
      copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest_path }}"
        mode: '0600'
      loop:
        - { content: "{{ external_ssl_files_host_certificate }}", dest_path: "/etc/gitlab/ssl/{{ external_host }}.crt" }
        - { content: "{{ external_ssl_files_host_key }}", dest_path: "/etc/gitlab/ssl/{{ external_host }}.key" }
      no_log: true
      diff: false
  when: gitlab_rails_nginx_external_ssl_user

- name: Copy GitLab Rails NGINX Internal SSL certificates (Multi Node)
  block:
    - name: Copy over any GitLab Rails NGINX SSL files
      copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest_path }}"
        mode: '0600'
      loop:
        - { content: "{{ gitlab_rails_nginx_ssl_cert }}", dest_path: "/etc/gitlab/ssl/gitlab_rails_nginx.pem" }
        - { content: "{{ gitlab_rails_nginx_ssl_key }}", dest_path: "/etc/gitlab/ssl/gitlab_rails_nginx.pem.key" }
      when: item.content != ''
  no_log: true
  diff: false
  when: gitlab_rails_nginx_ssl

- name: Copy Praefect or Gitaly CA files if configured
  block:
    - name: Copy Praefect Internal SSL CA file if configured
      copy:
        content: "{{ praefect_ssl_ca }}"
        dest: '/etc/gitlab/trusted-certs/praefect_ca.pem'
        mode: '0644'
      when:
        - "'praefect' in groups"
        - praefect_ssl
        - praefect_ssl_ca != ''

    - name: Copy Gitaly Internal SSL CA file if configured
      copy:
        content: "{{ gitaly_ssl_ca }}"
        dest: '/etc/gitlab/trusted-certs/gitaly_ca.pem'
        mode: '0644'
      when:
        - "'praefect' not in groups"
        - "'gitaly' in groups"
        - gitaly_ssl
        - gitaly_ssl_ca != ''
  no_log: true
  diff: false
