---
- name: Copy External SSL certificates (Single Node)
  block:
    - name: Check if External SSL certificate is provided (Single Node)
      stat:
        path: "{{ external_ssl_files_host_certificate_file }}"
      delegate_to: localhost
      become: false
      register: ssl_pem

    - name: Fail if External SSL certificate is missing (Single Node)
      fail:
        msg: "External SSL certificate file '{{ external_ssl_files_host_certificate_file | basename }}' could not be found in path '{{ external_ssl_files_host_certificate_file | realpath }}'. Check that the file is present as configured and run again. Exiting..."
      when: not ssl_pem.stat.exists

    - name: Check if External SSL key is provided (Single Node)
      stat:
        path: "{{ external_ssl_files_host_key_file }}"
      delegate_to: localhost
      become: false
      register: ssl_key

    - name: Fail if External SSL key is missing (Single Node)
      fail:
        msg: "External SSL key file '{{ external_ssl_files_host_key_file | basename }}' could not be found in path '{{ external_ssl_files_host_key_file | realpath }}'. Check that the file is present as configured and run again. Exiting..."
      when: not ssl_key.stat.exists

    - name: Copy over User provided SSL Certificates (Single Node)
      copy:
        src: "{{ item.hostfile }}"
        dest: "{{ item.targetfile }}"
        mode: '0600'
      loop:
        - { hostfile: "{{ external_ssl_files_host_certificate_file }}", targetfile: "/etc/gitlab/ssl/{{ external_host }}.crt" }
        - { hostfile: "{{ external_ssl_files_host_key_file }}", targetfile: "/etc/gitlab/ssl/{{ external_host }}.key" }
  when: gitlab_rails_nginx_external_ssl_user

- name: Copy GitLab Rails NGINX Internal SSL certificates (Multi Node)
  block:
    - name: Copy over any GitLab Rails NGINX SSL files
      copy:
        src: "{{ item.src_path }}"
        dest: "{{ item.dest_path }}"
        mode: '0600'
      loop:
        - { src_path: "{{ gitlab_rails_nginx_ssl_cert_file }}", dest_path: "/etc/gitlab/ssl/gitlab_rails_nginx.pem" }
        - { src_path: "{{ gitlab_rails_nginx_ssl_key_file }}", dest_path: "/etc/gitlab/ssl/gitlab_rails_nginx.pem.key" }
      when: item.src_path != ''
  when: gitlab_rails_nginx_ssl

- name: Copy Praefect or Gitaly CA files if configured
  block:
    - name: Copy Praefect Internal SSL CA file if configured
      copy:
        content: "{{ praefect_ssl_ca }}"
        dest: '/etc/gitlab/trusted-certs/praefect_ca.pem'
        mode: '0644'
      when:
        - "'praefect' in groups"
        - praefect_ssl
        - praefect_ssl_ca != ''

    - name: Copy Gitaly Internal SSL CA file if configured
      copy:
        content: "{{ gitaly_ssl_ca }}"
        dest: '/etc/gitlab/trusted-certs/gitaly_ca.pem'
        mode: '0644'
      when:
        - "'praefect' not in groups"
        - "'gitaly' in groups"
        - gitaly_ssl
        - gitaly_ssl_ca != ''
