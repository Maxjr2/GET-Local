---
# For OpenSearch and GitLab version compatibility, refer to: https://docs.gitlab.com/integration/advanced_search/elasticsearch/#opensearch.
opensearch_version: "{{ lookup('env', 'OPENSEARCH_VERSION') | default('2.17.1' if gitlab_version != '' and gitlab_version is version('17.6.2', '<=') else '2.19.1', true) }}"

opensearch_docker_image: "{{ lookup('env','OPENSEARCH_DOCKER_IMAGE') | default('opensearchproject/opensearch:' + opensearch_version, true) }}"
opensearch_docker_prune: true

opensearch_heap_size: "{{ (ansible_memtotal_mb * 0.5) | round | int }}"
