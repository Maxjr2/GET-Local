- name: Configure Advanced Search (Rails)
  block:
    - name: Clean out previous Advanced Search configuration and index
      block:
        - name: Delete old Advanced Search index for GitLab
          command: "{{ item }}"
          loop:
            - gitlab-rake gitlab:elastic:delete_index
            - gitlab-rake gitlab:elastic:clear_index_status
          delegate_to: "{{ groups['gitlab_rails'][0] }}"
          delegate_facts: true
          become: true
          register: delete_result
          failed_when:
            - delete_result.rc != 0
            - '"no address" not in delete_result.stderr'
            - '"Net::OpenTimeout" not in delete_result.stderr'

        - name: Unconfigure Advanced Search settings
          command: |
            gitlab-rails runner "
              ApplicationSetting.last.update(elasticsearch_url: '')
              ApplicationSetting.last.update(elasticsearch_indexing: false)
              ApplicationSetting.last.update(elasticsearch_search: false)
              if '{{ advanced_search_username }}' != '' && '{{ advanced_search_password }}' != ''
                ApplicationSetting.last.update(elasticsearch_username: '')
                ApplicationSetting.last.update(elasticsearch_password: '')
              end
            "
          delegate_to: "{{ groups['gitlab_rails'][0] }}"
          delegate_facts: true
          become: true

        - name: Pause for 60 secs for old Advanced Search index to clear
          wait_for:
            timeout: 60
      when: advanced_search_retry_setup | bool

    - name: Configure Advanced Search Indexing and URL setting
      block:
        - name: Configure initial Advanced Search settings
          command: |
            gitlab-rails runner "
              advanced_search_settings = {
                elasticsearch_url: \"{{ advanced_search_hosts | join(',') }}\",
                elasticsearch_indexing: true
              }

              if '{{ advanced_search_username }}' != '' && '{{ advanced_search_password }}' != ''
                advanced_search_settings[:elasticsearch_username] = \"{{ advanced_search_username }}\"
                advanced_search_settings[:elasticsearch_password] = \"{{ advanced_search_password }}\"
              end

              # Merge custom config if provided
              {{ advanced_search_custom_config }}.each { |k, v| advanced_search_settings[k.to_sym] = v }

              ApplicationSetting.last.update(advanced_search_settings)
            "
          delegate_to: "{{ groups['gitlab_rails'][0] }}"
          delegate_facts: true
          become: true
          no_log: true
          register: advanced_search_status_result
          retries: 5
          delay: 5
          until: advanced_search_status_result is success

        - name: Pause for 60 secs to allow Sidekiq caches to be updated
          wait_for:
            timeout: 60
      when: (gitlab_environment_settings.elasticsearch_url != (advanced_search_hosts | join(',')) or
            not gitlab_environment_settings.elasticsearch_indexing) or
            advanced_search_retry_setup | bool

    - name: Perform Advanced Search Indexing
      block:
        - name: Index all GitLab data
          command: gitlab-rake gitlab:elastic:index
          delegate_to: "{{ groups['gitlab_rails'][0] }}"
          delegate_facts: true
          become: true

        - name: Wait until indexing is complete
          command: gitlab-rake gitlab:elastic:index_projects_status
          delegate_to: "{{ groups['gitlab_rails'][0] }}"
          delegate_facts: true
          become: true
          register: index_status_result
          retries: 20
          delay: 10
          until: "(index_status_result.stdout | regex_search('[0-9]+\\.[0-9]+') | float > 90.0) or '(0/0 projects)' in index_status_result.stdout"
          when: advanced_search_enable | bool
      when: not gitlab_environment_settings.elasticsearch_indexing or
            advanced_search_retry_setup | bool

    - name: Enable Advanced Search
      command: "gitlab-rails runner 'ApplicationSetting.last.update(elasticsearch_search: true)'"
      delegate_to: "{{ groups['gitlab_rails'][0] }}"
      delegate_facts: true
      become: true
      when:
        - advanced_search_enable | bool
        - not gitlab_environment_settings.elasticsearch_search or
          advanced_search_retry_setup | bool
  when: "'gitlab_rails' in groups"

- name: Configure Advanced Search (Cloud Native Toolbox)
  block:
    - name: Clean out previous Advanced Search configuration and index
      block:
        - name: Delete old Advanced Search index
          kubernetes.core.k8s_exec:
            pod: "{{ toolbox_pod }}"
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
            command: "{{ item }}"
          loop:
            - gitlab-rake gitlab:elastic:delete_index
            - gitlab-rake gitlab:elastic:clear_index_status
          register: delete_result
          failed_when:
            - delete_result.rc != 0
            - '"no address" not in delete_result.stderr'
            - '"Net::OpenTimeout" not in delete_result.stderr'
            - '"Failed to open TCP connection" not in delete_result.stderr'

        - name: Unconfigure Advanced Search settings
          kubernetes.core.k8s_exec:
            pod: "{{ toolbox_pod }}"
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
            command: |
              gitlab-rails runner "
                ApplicationSetting.last.update(elasticsearch_url: '')
                ApplicationSetting.last.update(elasticsearch_indexing: false)
                ApplicationSetting.last.update(elasticsearch_search: false)
                if '{{ advanced_search_username }}' != '' && '{{ advanced_search_password }}' != ''
                  ApplicationSetting.last.update(elasticsearch_username: '')
                  ApplicationSetting.last.update(elasticsearch_password: '')
                end
              "

        - name: Pause for 60 secs for old Advanced Search index to clear
          wait_for:
            timeout: 60
      when: advanced_search_retry_setup | bool

    - name: Configure Advanced Search Indexing and URL setting
      block:
        - name: Configure initial Advanced Search settings via GitLab Toolbox pod
          kubernetes.core.k8s_exec:
            pod: "{{ toolbox_pod }}"
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
            command: |
              gitlab-rails runner "
                advanced_search_settings = {
                  elasticsearch_url: \"{{ advanced_search_hosts | join(',') }}\",
                  elasticsearch_indexing: true
                }

                if '{{ advanced_search_username }}' != '' && '{{ advanced_search_password }}' != ''
                  advanced_search_settings[:elasticsearch_username] = \"{{ advanced_search_username }}\"
                  advanced_search_settings[:elasticsearch_password] = \"{{ advanced_search_password }}\"
                end

                # Merge custom config if provided
                {{ advanced_search_custom_config }}.each { |k, v| advanced_search_settings[k.to_sym] = v }

                ApplicationSetting.last.update(advanced_search_settings)
              "
          register: advanced_search_status_result
          retries: 5
          delay: 5
          until: advanced_search_status_result is success

        - name: Pause for 60 secs to allow Sidekiq caches to be updated
          wait_for:
            timeout: 60
      when: (gitlab_environment_settings.elasticsearch_url != (advanced_search_hosts | join(',')) or
            not gitlab_environment_settings.elasticsearch_indexing) or
            advanced_search_retry_setup | bool

    - name: Perform Advanced Search Indexing
      block:
        - name: Index all GitLab data
          kubernetes.core.k8s_exec:
            pod: "{{ toolbox_pod }}"
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
            command: gitlab-rake gitlab:elastic:index

        - name: Wait until indexing is complete
          kubernetes.core.k8s_exec:
            pod: "{{ toolbox_pod }}"
            namespace: "{{ gitlab_cloud_native_release_namespace }}"
            command: gitlab-rake gitlab:elastic:index_projects_status
          register: index_status_result
          retries: 20
          delay: 10
          until: "(index_status_result.stdout | regex_search('[0-9]+\\.[0-9]+') | float > 90.0) or '(0/0 projects)' in index_status_result.stdout"
          when: advanced_search_enable | bool
      when: not gitlab_environment_settings.elasticsearch_indexing or
            advanced_search_retry_setup | bool

    - name: Enable Advanced Search
      kubernetes.core.k8s_exec:
        pod: "{{ toolbox_pod }}"
        namespace: "{{ gitlab_cloud_native_release_namespace }}"
        command: "gitlab-rails runner 'ApplicationSetting.last.update(elasticsearch_search: true)'"
      when:
        - advanced_search_enable | bool
        - not gitlab_environment_settings.elasticsearch_search or
          advanced_search_retry_setup | bool
  when:
    - toolbox_pod is defined
    - "'gitlab_rails' not in groups"
