---
- name: Setup GitLab config file
  template:
    src: templates/postgres.gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
  tags: reconfigure

- name: Configure Custom Config
  block:
    - name: Check if custom config exists
      stat:
        path: "{{ postgres_custom_config_file }}"
      delegate_to: localhost
      become: false
      register: postgres_custom_config_file_path

    - name: Setup Custom Config
      template:
        src: "{{ postgres_custom_config_file }}"
        dest: "/etc/gitlab/gitlab.postgres.custom.rb"
        mode: '0600'
      when: postgres_custom_config_file_path.stat.exists

    - name: Remove old Custom Config if not configured
      file:
        path: "/etc/gitlab/gitlab.postgres.custom.rb"
        state: absent
      when: not postgres_custom_config_file_path.stat.exists
  tags: reconfigure

- name: Copy over any Custom Files
  copy:
    src: "{{ item.src_path }}"
    dest: "{{ item.dest_path }}"
    mode: "{{ item.mode if item.mode is defined else 'preserve' }}"
  loop: "{{ postgres_custom_files_paths }}"
  tags: reconfigure

- name: Propagate Secrets if existing
  include_role:
    name: common
    tasks_from: secrets
  when: gitlab_secrets_setup
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Check if GitLab Linux package json config file exists
  stat:
    path: "/opt/gitlab/embedded/nodes/{{ ansible_fqdn }}.json"
  register: gitlab_json_config_file
  tags:
    - reconfigure
    - restart

- name: Reconfigure and restart PostgreSQL (Single Node PostgreSQL and Fresh Installs)
  include_tasks: reconfigure.yml
  when: groups['postgres'] | length == 1 or not gitlab_json_config_file.stat.exists
  tags:
    - reconfigure
    - restart

- name: Upgrade Multi Node PostgreSQL ordered
  block:
    - name: Get PostgreSQL leader (Multi Node)
      command: gitlab-ctl get-postgresql-primary
      register: postgres_leader_int_address
      run_once: true

    - name: Reconfigure and restart PostgreSQL (Multi Node PostgreSQL - Secondaries)
      include_tasks: reconfigure.yml
      when: (ansible_default_ipv4.address != postgres_leader_int_address.stdout.split(':')[0])

    - name: Reconfigure and restart PostgreSQL (Multi Node PostgreSQL - Leader)
      include_tasks: reconfigure.yml
      when: (ansible_default_ipv4.address == postgres_leader_int_address.stdout.split(':')[0])
  when:
    - groups['postgres'] | length > 1
    - gitlab_json_config_file.stat.exists
  tags:
    - reconfigure
    - restart

- name: Show debug output of postgres cluster status
  block:
    - name: Debug capture output of 'gitlab-ctl patroni members'
      shell: "gitlab-ctl patroni members 2>/dev/null"
      register: patroni_members
      ignore_errors: true

    - name: Debug show output of 'gitlab-ctl patroni members'
      debug:
        msg: "{{ patroni_members.stdout }}"
      when: patroni_members.stdout is defined
  when: groups['postgres'] | length > 1
  tags:
    - debug
    - reconfigure

- name: Propagate Secrets if new or changed
  include_role:
    name: common
    tasks_from: secrets
  vars:
    gitlab_secrets_post_reconfigure: true
  when: gitlab_secrets_setup
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Run Custom Tasks
  block:
    - name: Check if Custom Tasks file exists
      stat:
        path: "{{ postgres_custom_tasks_file }}"
      register: postgres_custom_tasks_file_path
      delegate_to: localhost
      become: false

    - name: Run Custom Tasks
      include_tasks:
        file: "{{ postgres_custom_tasks_file }}"
        apply:
          tags: custom_tasks
      when: postgres_custom_tasks_file_path.stat.exists
  tags: custom_tasks
