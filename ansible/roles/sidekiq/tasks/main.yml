---
- name: Mount NFS if configured
  include_role:
    name: gitlab_nfs
    tasks_from: nfs_mount
  when:
    - "'gitlab_nfs' in groups"

- name: Setup GitLab config file
  template:
    src: templates/sidekiq.gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
  tags: reconfigure

- name: Configure Custom Config
  block:
    - name: Check if Custom Config exists
      stat:
        path: "{{ sidekiq_custom_config_file }}"
      delegate_to: localhost
      become: false
      register: sidekiq_custom_config_file_path

    - name: Setup Custom Config
      template:
        src: "{{ sidekiq_custom_config_file }}"
        dest: "/etc/gitlab/gitlab.sidekiq.custom.rb"
        mode: '0600'
      when: sidekiq_custom_config_file_path.stat.exists

    - name: Remove old Custom Config if not configured
      file:
        path: "/etc/gitlab/gitlab.sidekiq.custom.rb"
        state: absent
      when: not sidekiq_custom_config_file_path.stat.exists
  tags: reconfigure

- name: Copy over any Custom Files
  copy:
    src: "{{ item.src_path }}"
    dest: "{{ item.dest_path }}"
    mode: "{{ item.mode if item.mode is defined else 'preserve' }}"
  loop: "{{ sidekiq_custom_files_paths }}"
  tags: reconfigure

- name: Copy Praefect or Gitaly CA files if configured
  block:
    - name: Copy Praefect Internal SSL CA file if configured
      copy:
        content: "{{ praefect_ssl_ca }}"
        dest: '/etc/gitlab/trusted-certs/praefect_ca.pem'
        mode: '0644'
      when:
        - "'praefect' in groups"
        - praefect_ssl
        - praefect_ssl_ca != ''

    - name: Copy Gitaly Internal SSL CA file if configured
      copy:
        content: "{{ gitaly_ssl_ca }}"
        dest: '/etc/gitlab/trusted-certs/gitaly_ca.pem'
        mode: '0644'
      when:
        - "'praefect' not in groups"
        - "'gitaly' in groups"
        - gitaly_ssl
        - gitaly_ssl_ca != ''
  no_log: true
  diff: false
  tags: reconfigure

- name: Propagate Secrets if existing
  include_role:
    name: common
    tasks_from: secrets
  when: gitlab_secrets_setup
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

- name: Reconfigure Sidekiq
  command: gitlab-ctl reconfigure
  register: result
  retries: 3
  until: result is success
  tags:
    - reconfigure

- name: Propagate Secrets if new or changed
  include_role:
    name: common
    tasks_from: secrets
  vars:
    gitlab_secrets_post_reconfigure: true
  when: gitlab_secrets_setup
  tags:
    - reconfigure
    - secrets
    - gitlab-secrets

# https://docs.gitlab.com/administration/sidekiq/#configure-the-container-registry-when-using-an-external-sidekiq
- name: Propagate GitLab Registry Key from Rails to Sidekiq nodes
  block:
    - name: Check if GitLab Registry Key file exists on primary Rails node
      stat:
        path: "/var/opt/gitlab/gitlab-rails/etc/gitlab-registry.key"
      register: gitlab_registry_key_file_path
      delegate_to: "{{ groups['gitlab_rails_primary'][0] | default(omit) }}"
      run_once: true

    - name: Process GitLab Registry Key if it exists
      block:
        - name: Read GitLab Registry Key file from primary Rails node
          slurp:
            path: "/var/opt/gitlab/gitlab-rails/etc/gitlab-registry.key"
          register: gitlab_registry_key_slurp
          delegate_to: "{{ groups['gitlab_rails_primary'][0] | default(omit) }}"
          no_log: true
          run_once: true

        - name: Save GitLab Registry Key file contents as fact
          set_fact:
            gitlab_registry_key_content: "{{ gitlab_registry_key_slurp.content }}"
          delegate_to: localhost
          delegate_facts: true
          become: false
          no_log: true
          run_once: true

        - name: Check if GitLab Rails etc directory exists on Sidekiq node
          stat:
            path: "/var/opt/gitlab/gitlab-rails/etc"
          register: gitlab_rails_etc_dir

        - name: Write GitLab Registry Key file to Sidekiq node
          copy:
            content: "{{ hostvars['localhost'].gitlab_registry_key_content | b64decode }}"
            dest: "/var/opt/gitlab/gitlab-rails/etc/gitlab-registry.key"
            owner: git
            group: git
            mode: "0644"
          no_log: true
          when: gitlab_rails_etc_dir.stat.exists
      when: gitlab_registry_key_file_path.stat.exists
  when:
    - "'gitlab_rails_primary' in groups"
    - container_registry_enable
  tags:
    - reconfigure
    - secrets

- name: Restart Sidekiq
  command: gitlab-ctl restart
  register: result
  retries: 2
  until: result is success
  tags:
    - reconfigure
    - restart

- name: Run Custom Tasks
  block:
    - name: Check if Custom Tasks file exists
      stat:
        path: "{{ sidekiq_custom_tasks_file }}"
      register: sidekiq_custom_tasks_file_path
      delegate_to: localhost
      become: false

    - name: Run Custom Tasks
      include_tasks:
        file: "{{ sidekiq_custom_tasks_file }}"
        apply:
          tags: custom_tasks
      when: sidekiq_custom_tasks_file_path.stat.exists
  tags: custom_tasks
