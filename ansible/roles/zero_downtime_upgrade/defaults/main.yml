zdu_start_point: "{{ lookup('env','ZDU_START_POINT') | default('consul', true) }}"
zdu_update_order:
  - consul
  - postgres
  - pgbouncer
  - redis
  - gitaly
  - praefect
  - gitlab_rails
  - sidekiq
  - geo
  - post_migrations

# Rails Local Health Check URL
# Deprecated: gitlab_rails_readiness_url is superseded by gitlab_rails_local_health_check_url..
gitlab_rails_local_health_check_url: "{{ gitlab_rails_readiness_url if gitlab_rails_readiness_url is defined else (('https' if gitlab_rails_nginx_ssl else 'http') + '://localhost/-/readiness') }}"
