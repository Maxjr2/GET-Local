# Components are upgraded in dependency order defined by zdu_update_order (see defaults/main.yml).
# Each task skips components earlier than zdu_start_point, allowing mid-sequence resumption after a failure.
- name: Update Consul nodes
  include_role:
    name: consul
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('consul') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'consul') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Update PostgreSQL nodes
  block:
    - name: Get PostgreSQL leader for ZDU ordering
      command: gitlab-ctl get-postgresql-primary
      register: zdu_postgres_leader_result

    - name: Set ZDU PostgreSQL leader facts
      set_fact:
        zdu_postgres_leader_address: "{{ zdu_postgres_leader_result.stdout.split(':')[0] }}"

    - name: Update PostgreSQL (Secondaries)
      include_role:
        name: postgres
      when:
        - inventory_hostname == hostname_result
        - hostvars[hostname_result]['ansible_default_ipv4']['address'] != zdu_postgres_leader_address
      loop: "{{ query('inventory_hostnames', 'postgres') | sort }}"
      loop_control:
        loop_var: hostname_result

    - name: Update PostgreSQL (Leader)
      include_role:
        name: postgres
      when:
        - inventory_hostname == hostname_result
        - hostvars[hostname_result]['ansible_default_ipv4']['address'] == zdu_postgres_leader_address
      loop: "{{ query('inventory_hostnames', 'postgres') | sort }}"
      loop_control:
        loop_var: hostname_result
  when:
    - zdu_update_order.index('postgres') >= zdu_update_order.index(zdu_start_point)
    - ('postgres' in group_names)

- name: Update PgBouncer nodes
  include_role:
    name: pgbouncer
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('pgbouncer') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'pgbouncer') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Update Redis nodes
  include_role:
    name: redis
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('redis') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'redis:redis_cache:redis_persistent') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Update Gitaly nodes
  include_role:
    name: gitaly
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('gitaly') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'gitaly') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Update Praefect deploy node with all migrations
  include_role:
    name: praefect
  when:
    - "'praefect_primary' in group_names"
    - zdu_update_order.index('praefect') >= zdu_update_order.index(zdu_start_point)

- name: Update other Praefect nodes
  include_role:
    name: praefect
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('praefect') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'praefect_secondary') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Update GitLab Rails deploy node with pre migrations
  include_tasks:
    file: update-rails.yml
    apply:
      environment:
        SKIP_POST_DEPLOYMENT_MIGRATIONS: "true"
  vars:
    skip_post_migrations: "true"
  when:
    - "'gitlab_rails_primary' in group_names"
    - zdu_update_order.index('gitlab_rails') >= zdu_update_order.index(zdu_start_point)

- name: Update other GitLab Rails nodes
  include_tasks: update-rails.yml
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('gitlab_rails') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'gitlab_rails_secondary') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Update Sidekiq nodes
  include_role:
    name: sidekiq
  when:
    - inventory_hostname == hostname_result
    - zdu_update_order.index('sidekiq') >= zdu_update_order.index(zdu_start_point)
  loop: "{{ query('inventory_hostnames', 'sidekiq') | sort }}"
  loop_control:
    loop_var: hostname_result

- name: Restart geo-logcursor on secondary site if present
  command: gitlab-ctl restart geo-logcursor
  when:
    - ('gitlab_rails' in group_names)
    - (geo_secondary_site_group_name in groups)
    - zdu_update_order.index('geo') >= zdu_update_order.index(zdu_start_point)

- name: Run post-deployment migrations via GitLab Rails deploy node
  include_tasks: post-deployment-migrations.yml
  when:
    - "'gitlab_rails_primary' in group_names"
    - zdu_update_order.index('post_migrations') >= zdu_update_order.index(zdu_start_point)
    - gitlab_charts_zero_downtime_geo_post_deployment_migrations
